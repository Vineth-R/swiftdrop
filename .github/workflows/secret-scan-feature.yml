name: Secret scanning (feature branches)

# Feature-branch pushes do not run the full CI workflow, so they get a small
# dedicated secret scan. Pull requests and protected pushes are covered by the
# secret-security job in ci.yml.
on:
  push:
    branches-ignore:
      - development
      - main

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  feature-branch:
    name: Secret scanning (feature branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out full history
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install pinned Gitleaks
        env:
          GITLEAKS_VERSION: '8.30.1'
          GITLEAKS_LINUX_X64_SHA256: '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'
        run: |
          set -euo pipefail
          archive="/tmp/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --silent --show-error --location \
            --retry 3 --retry-delay 2 \
            --output "${archive}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_LINUX_X64_SHA256}  ${archive}" | sha256sum --check --strict
          mkdir -p "${HOME}/.local/bin"
          tar --extract --gzip --file "${archive}" --directory "${HOME}/.local/bin" gitleaks
          chmod 0755 "${HOME}/.local/bin/gitleaks"
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"
          "${HOME}/.local/bin/gitleaks" version

      - name: Scan pushed feature branch commit range for secrets
        env:
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_AFTER_SHA: ${{ github.event.after }}
        run: |
          set -euo pipefail
          BASE_CONFIG="$(mktemp)"
          trap 'rm -f "${BASE_CONFIG}"' EXIT
          if [ -z "${PUSH_AFTER_SHA:-}" ] || [ "${PUSH_AFTER_SHA}" = "0000000000000000000000000000000000000000" ]; then
            echo "::error::Pushed commit SHA is missing; refusing to scan"
            exit 1
          fi
          git cat-file -e "${PUSH_AFTER_SHA}^{commit}"
          if [ -n "${PUSH_BEFORE_SHA:-}" ] && [ "${PUSH_BEFORE_SHA}" != "0000000000000000000000000000000000000000" ]; then
            git cat-file -e "${PUSH_BEFORE_SHA}^{commit}"
            BASE_SHA="${PUSH_BEFORE_SHA}"
          else
            BASE_SHA="$(git merge-base origin/development "${PUSH_AFTER_SHA}")"
          fi
          if [ -z "${BASE_SHA:-}" ]; then
            echo "::error::Could not resolve a base SHA for the pushed branch; refusing to scan"
            exit 1
          fi
          git cat-file -e "${BASE_SHA}^{commit}"
          if ! git cat-file -e "origin/development:.gitleaks.toml"; then
            echo "::error::The trusted development Gitleaks config is missing; refusing to scan"
            exit 1
          fi
          git show "origin/development:.gitleaks.toml" > "${BASE_CONFIG}"
          echo "Scanning pushed branch range ${BASE_SHA}..${PUSH_AFTER_SHA} with the trusted development config (merge diffs included)"
          gitleaks git \
            --config "${BASE_CONFIG}" \
            --redact \
            --no-banner \
            --no-color \
            --verbose \
            --exit-code 1 \
            --log-opts="${BASE_SHA}..${PUSH_AFTER_SHA} -m" \
            .
