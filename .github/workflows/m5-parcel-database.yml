name: M5 Parcel workflows and database

on:
  push:
    branches:
      - feature/m5-parcel-creation
      - feature/m5-complete-parcel-flow
  pull_request:
    branches:
      - development
      - main
    paths:
      - 'apps/services/parcel/**'
      - 'packages/go-common/**'
      - 'migrations/parcel/**'
      - 'tests/integration/**'
      - 'scripts/check-m5-coverage.mjs'
      - 'infra/docker/postgres/init/01-schemas.sql'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/m5-parcel-database.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m5-parcel-database-${{ github.ref }}
  cancel-in-progress: true

jobs:
  postgres:
    name: Parcel workflows, migrations and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CGO_ENABLED: '1'
      PARCEL_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install the pinned migration CLI
        run: |
          go install -tags postgres github.com/golang-migrate/migrate/v4/cmd/migrate@v4.18.3
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Run Parcel unit tests
        run: >-
          go test -race -count=1 ./apps/services/parcel/...
          ./packages/go-common/postgres ./tests/integration/parceltest

      - name: Run PostgreSQL migration, repository and courier read tests
        run: >-
          go test -race -count=1 -v -tags=integration,postgres
          -run '^(TestParcel|TestCourier)'
          ./tests/integration ./tests/integration/parceltest
          ./apps/services/parcel/internal/repository
          ./apps/services/parcel/internal/http

      - name: Run complete Parcel workflows with PostgreSQL and coverage
        run: >-
          go test -race -count=1 -tags=integration,postgres
          -covermode=atomic -coverpkg=./apps/services/parcel/...
          -coverprofile=m5-parcel-coverage.out ./apps/services/parcel/...

      # This job only needs Node for `node --test` and the coverage script, but
      # setup-node v5 enables package-manager caching by default and then looks
      # for the repository's pinned pnpm binary. Install that pinned pnpm (the
      # same convention the main CI jobs use) so the lookup cannot fail.
      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Test credential-safe live-journey diagnostics
        run: node --test tests/integration/parcelflow/safe-errors.test.mjs

      - name: Check Member 5 statement coverage
        run: node scripts/check-m5-coverage.mjs m5-parcel-coverage.out

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m5-parcel-coverage
          path: m5-parcel-coverage.out
          if-no-files-found: ignore

      - name: Run the complete dispatch database suite
        run: >-
          go test -race -count=1 -tags=integration ./tests/integration/database/...
