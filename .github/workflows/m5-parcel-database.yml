name: M5 Parcel database

on:
  push:
    branches:
      - feature/m5-parcel-creation
  pull_request:
    branches:
      - development
      - main
    paths:
      - 'apps/services/parcel/**'
      - 'packages/go-common/**'
      - 'migrations/parcel/**'
      - 'tests/integration/**'
      - 'infra/docker/postgres/init/01-schemas.sql'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/m5-parcel-database.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m5-parcel-database-${{ github.ref }}
  cancel-in-progress: true

jobs:
  postgres:
    name: Parcel migration and repository tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CGO_ENABLED: '1'
      PARCEL_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install the pinned migration CLI
        run: |
          go install -tags postgres github.com/golang-migrate/migrate/v4/cmd/migrate@v4.18.3
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Run Parcel unit tests
        run: >-
          go test -race -count=1 ./apps/services/parcel/...
          ./packages/go-common/postgres ./tests/integration/parceltest

      - name: Run PostgreSQL migration and repository tests
        run: >-
          go test -race -count=1 -tags=integration,postgres -run '^TestParcel'
          ./tests/integration ./tests/integration/parceltest
          ./apps/services/parcel/internal/repository

      - name: Run the complete dispatch database suite
        run: >-
          go test -race -count=1 -tags=integration ./tests/integration/database/...
