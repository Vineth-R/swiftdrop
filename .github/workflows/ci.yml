name: CI

on:
  push:
    branches:
      - development
      - main
    tags:
      - 'v*'
      - 'milestone-*'
  pull_request:
    branches:
      - development
      - main

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: 1
  NX_TELEMETRY_DISABLED: 1

jobs:
  go:
    name: Go checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: |
          set -euo pipefail
          file_count="$(find apps/services packages/go-common tests -type f -name '*.go' | wc -l | tr -d ' ')"
          if [ "$file_count" -eq 0 ]; then
            echo "No Go files found in the expected directories."
            exit 1
          fi

          unformatted="$(find apps/services packages/go-common tests -type f -name '*.go' -exec gofmt -l {} +)"
          if [ -n "$unformatted" ]; then
            echo "The following Go files are not formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test with race detector and coverage
        run: ./scripts/coverage.sh

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: go-coverage
          path: |
            coverage.out
            coverage-summary.md
          if-no-files-found: error
          retention-days: 7

      - name: Build
        run: go build ./...

      - name: Validate shared router and logger adoption
        run: go test ./tests/architecture -run TestRepositorySharedInfrastructure -v

      - name: Validate Docker Compose configuration
        run: docker compose config --quiet

      - name: Validate worker healthchecks
        run: |
          set -euo pipefail
          if grep -n 'pgrep -f /usr/local/bin/service' docker-compose.yml; then
            echo "::error::Worker healthchecks must match the service process, not the healthcheck shell command line."
            exit 1
          fi
          test "$(grep -c 'pgrep -x /usr/local/bin/service' docker-compose.yml)" -ge 2

  go-security:
    name: Go vulnerability scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install pinned govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0

      - name: Scan for reachable vulnerabilities
        run: |
          set -euo pipefail
          status=0
          "$(go env GOPATH)/bin/govulncheck" -scan=symbol ./... 2>&1 | tee govulncheck.log || status=$?
          if [ "$status" -ne 0 ]; then
            echo "::error::govulncheck reported reachable vulnerabilities or failed (exit ${status}). See govulncheck.log."
            exit "$status"
          fi

  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - name: Enforce LF line endings for shell scripts
        run: |
          set -euo pipefail
          offenders="$(git ls-files --eol '*.sh' | awk '$1 != "i/lf"')"
          if [ -n "$offenders" ]; then
            echo "::error::Tracked shell scripts must use LF line endings. See .gitattributes."
            echo "$offenders"
            exit 1
          fi

          missing="$(git ls-files -z '*.sh' | xargs -0 git check-attr eol | awk -F': ' '$3 != "lf"')"
          if [ -n "$missing" ]; then
            echo "::error::Shell scripts must match the .gitattributes eol=lf rule."
            echo "$missing"
            exit 1
          fi
          echo "All tracked shell scripts are LF and covered by the eol rule."

  secret-security:
    name: Secret scanning (Gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out full history
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install pinned Gitleaks
        env:
          GITLEAKS_VERSION: '8.30.1'
          GITLEAKS_LINUX_X64_SHA256: '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'
        run: |
          set -euo pipefail
          archive="/tmp/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --silent --show-error --location \
            --retry 3 --retry-delay 2 \
            --output "${archive}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_LINUX_X64_SHA256}  ${archive}" | sha256sum --check --strict
          mkdir -p "${HOME}/.local/bin"
          tar --extract --gzip --file "${archive}" --directory "${HOME}/.local/bin" gitleaks
          chmod 0755 "${HOME}/.local/bin/gitleaks"
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"
          "${HOME}/.local/bin/gitleaks" version

      - name: Scan protected branch and tag history for secrets
        if: github.event_name == 'push' && (github.ref == 'refs/heads/development' || github.ref == 'refs/heads/main' || github.ref_type == 'tag')
        env:
          # Scan only history reachable from the pushed protected ref. The
          # checkout fetches every branch, so an unscoped scan would also
          # inspect unmerged feature branches and report their fixtures.
          PROTECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -z "${PROTECTED_SHA:-}" ]; then
            echo "::error::The pushed protected ref SHA is missing; refusing to scan"
            exit 1
          fi
          git cat-file -e "${PROTECTED_SHA}^{commit}"
          echo "Scanning protected ref history ${PROTECTED_SHA} (merge diffs included)"
          gitleaks git \
            --config .gitleaks.toml \
            --redact \
            --no-banner \
            --no-color \
            --verbose \
            --exit-code 1 \
            --log-opts="${PROTECTED_SHA} -m" \
            .

      - name: Scan pull request commit range for secrets
        if: github.event_name == 'pull_request'
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ -z "${PR_BASE_SHA:-}" ] || [ -z "${PR_HEAD_SHA:-}" ]; then
            echo "::error::Pull request base or head SHA is missing; refusing to scan"
            exit 1
          fi
          git cat-file -e "${PR_BASE_SHA}^{commit}"
          git cat-file -e "${PR_HEAD_SHA}^{commit}"
          echo "Scanning PR commit range ${PR_BASE_SHA}..${PR_HEAD_SHA} (merge diffs included)"
          gitleaks git \
            --config .gitleaks.toml \
            --redact \
            --no-banner \
            --no-color \
            --verbose \
            --exit-code 1 \
            --log-opts="${PR_BASE_SHA}..${PR_HEAD_SHA} -m" \
            .

      - name: Scan feature branch push commit range for secrets
        if: github.event_name == 'push' && github.ref_type == 'branch' && github.ref != 'refs/heads/development' && github.ref != 'refs/heads/main'
        env:
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_AFTER_SHA: ${{ github.event.after }}
        run: |
          set -euo pipefail
          if [ -z "${PUSH_AFTER_SHA:-}" ] || [ "${PUSH_AFTER_SHA}" = "0000000000000000000000000000000000000000" ]; then
            echo "::error::Pushed commit SHA is missing; refusing to scan"
            exit 1
          fi
          git cat-file -e "${PUSH_AFTER_SHA}^{commit}"
          if [ -n "${PUSH_BEFORE_SHA:-}" ] && [ "${PUSH_BEFORE_SHA}" != "0000000000000000000000000000000000000000" ]; then
            git cat-file -e "${PUSH_BEFORE_SHA}^{commit}"
            BASE_SHA="${PUSH_BEFORE_SHA}"
          else
            BASE_SHA="$(git merge-base origin/development "${PUSH_AFTER_SHA}")"
          fi
          if [ -z "${BASE_SHA:-}" ]; then
            echo "::error::Could not resolve a base SHA for the pushed branch; refusing to scan"
            exit 1
          fi
          git cat-file -e "${BASE_SHA}^{commit}"
          echo "Scanning pushed branch range ${BASE_SHA}..${PUSH_AFTER_SHA} (merge diffs included)"
          gitleaks git \
            --config .gitleaks.toml \
            --redact \
            --no-banner \
            --no-color \
            --verbose \
            --exit-code 1 \
            --log-opts="${BASE_SHA}..${PUSH_AFTER_SHA} -m" \
            .

  sast:
    name: SAST (CodeQL, ${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: go
            build_mode: autobuild
          - language: javascript-typescript
            build_mode: none
    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        if: matrix.language == 'go'
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build_mode }}

      - name: Autobuild
        if: matrix.build_mode == 'autobuild'
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: '/language:${{ matrix.language }}'

  integration:
    name: RabbitMQ integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      rabbitmq:
        image: rabbitmq:4.1-management-alpine
        env:
          RABBITMQ_DEFAULT_USER: swiftdrop
          RABBITMQ_DEFAULT_PASS: swiftdrop
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      RABBITMQ_URL: amqp://swiftdrop:swiftdrop@127.0.0.1:5672/
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Wait for RabbitMQ
        run: |
          set -euo pipefail
          if [ -z "${RABBITMQ_URL}" ]; then
            echo "::error::RABBITMQ_URL must be set; integration tests skip without it."
            exit 1
          fi

          timeout 60 bash -c 'until (echo >/dev/tcp/127.0.0.1/5672) 2>/dev/null; do sleep 1; done'

      - name: Run integration tests
        run: |
          set -euo pipefail
          go test -race -count=1 -tags=integration -v ./tests/integration | tee integration.log

          if grep -q -- '--- SKIP' integration.log; then
            echo "::error::RabbitMQ integration tests were skipped; the broker must be reachable."
            exit 1
          fi

  database:
    name: PostgreSQL integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: swiftdrop
          POSTGRES_PASSWORD: swiftdrop
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U swiftdrop -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://swiftdrop:swiftdrop@127.0.0.1:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Wait for PostgreSQL
        run: |
          set -euo pipefail
          if [ -z "${TEST_DATABASE_URL}" ]; then
            echo "::error::TEST_DATABASE_URL must be set; database tests skip without it."
            exit 1
          fi

          timeout 60 bash -c 'until (echo >/dev/tcp/127.0.0.1/5432) 2>/dev/null; do sleep 1; done'

      - name: Run database integration tests
        run: |
          set -euo pipefail
          go test -race -count=1 -tags=integration -v ./tests/integration/database/... ./apps/services/pricing/internal/http/... ./apps/services/notification-worker/internal/idempotency/... ./apps/services/notification-worker/internal/notificationlog/... ./apps/services/identity/internal/seed/... ./apps/services/merchant/internal/http/... | tee database.log

          if grep -q -- '--- SKIP' database.log; then
            echo "::error::PostgreSQL integration tests were skipped; the database must be reachable."
            exit 1
          fi

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 12.15.0

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test the design lint rules
        run: node --test "apps/web/eslint-rules/*.test.mjs"

      - name: Test the API clients
        run: node --test "apps/web/src/lib/*.test.mjs"

      - name: Validate event contracts
        run: node --test "tests/contracts/*.test.mjs"

      - name: Test web unit suite
        run: pnpm exec nx test @org/web --skip-nx-cache

      - name: Typecheck web
        run: pnpm exec nx typecheck @org/web --skip-nx-cache

      - name: Lint and build web
        run: pnpm exec nx run-many -t lint build --projects=@org/web,@org/web-e2e

      - name: Typecheck e2e
        run: pnpm exec nx typecheck @org/web-e2e

  frontend-security:
    name: Frontend production audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 12.15.0

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=high

  e2e:
    name: Playwright E2E (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: true
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 12.15.0

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Playwright E2E
        run: pnpm exec nx run @org/web-e2e:e2e --args="--project=chromium"

  changes:
    name: Detect changed projects
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.matrix.outputs.services }}
      access: ${{ steps.filter.outputs.access }}
      notificationflow: ${{ steps.filter.outputs.notificationflow }}
    steps:
      - uses: actions/checkout@v5

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            identity:
              - 'apps/services/identity/**'
              - 'packages/**'
              - 'go.mod'
              - 'go.sum'
              - 'infra/docker/go.Dockerfile'
              - '.dockerignore'
            parcel:
              - 'apps/services/parcel/**'
              - 'packages/**'
              - 'go.mod'
              - 'go.sum'
              - 'infra/docker/go.Dockerfile'
              - '.dockerignore'
            pricing:
              - 'apps/services/pricing/**'
              - 'packages/**'
              - 'go.mod'
              - 'go.sum'
              - 'infra/docker/go.Dockerfile'
              - '.dockerignore'
            merchant:
              - 'apps/services/merchant/**'
              - 'packages/**'
              - 'go.mod'
              - 'go.sum'
              - 'infra/docker/go.Dockerfile'
              - '.dockerignore'
            realtime:
              - 'apps/services/realtime/**'
              - 'packages/**'
              - 'go.mod'
              - 'go.sum'
              - 'infra/docker/go.Dockerfile'
              - '.dockerignore'
            ai-assistant:
              - 'apps/services/ai-assistant/**'
              - 'packages/**'
              - 'go.mod'
              - 'go.sum'
              - 'infra/docker/go.Dockerfile'
              - '.dockerignore'
            notification-worker:
              - 'apps/services/notification-worker/**'
              - 'packages/**'
              - 'go.mod'
              - 'go.sum'
              - 'infra/docker/go.Dockerfile'
              - '.dockerignore'
            webhook-worker:
              - 'apps/services/webhook-worker/**'
              - 'packages/**'
              - 'go.mod'
              - 'go.sum'
              - 'infra/docker/go.Dockerfile'
              - '.dockerignore'
            web:
              - 'apps/web/**'
              - 'infra/docker/web.Dockerfile'
              - '.dockerignore'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'package.json'
              - 'nx.json'
              - 'tsconfig.base.json'
              - 'tsconfig.json'
              - 'apps/web-e2e/package.json'
            access:
              - 'docker-compose.yml'
              - 'infra/nginx/**'
              - 'infra/docker/postgres/**'
              - 'migrations/**'
              - 'tests/access/**'
              - 'Makefile'
              - 'scripts/migrate.sh'
              - 'scripts/verify-db.sh'
              - 'scripts/check-routes.sh'
              - '.env.example'
            notificationflow:
              - 'apps/services/notification-worker/**'
              - 'apps/services/identity/**'
              - 'packages/go-common/**'
              - 'migrations/notification/**'
              - 'infra/docker/postgres/init/01-schemas.sql'
              - 'tests/integration/notificationflow/**'
              - 'docker-compose.yml'
              - 'infra/docker/go.Dockerfile'
              - 'scripts/migrate.sh'
              - 'Makefile'
              - '.env.example'
              - 'go.mod'
              - 'go.sum'
              - '.github/workflows/ci.yml'

      - name: Separate Docker services from access-only changes
        id: matrix
        env:
          CHANGED: ${{ steps.filter.outputs.changes }}
        run: |
          set -euo pipefail
          services="$(jq -c '[.[] | select(. != "access") | select(. != "notificationflow")]' <<< "${CHANGED:-[]}")"
          echo "services=${services}" >> "$GITHUB_OUTPUT"

  docker:
    name: Docker build (${{ matrix.service }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: changes
    if: needs.changes.outputs.services != '[]' && needs.changes.outputs.services != ''
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.services) }}
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Build Go service image
        if: matrix.service != 'web'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/go.Dockerfile
          build-args: |
            SERVICE=${{ matrix.service }}
          push: false
          load: true
          tags: swiftdrop/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=go
          cache-to: type=gha,mode=max,scope=go

      - name: Build web image
        if: matrix.service == 'web'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/web.Dockerfile
          push: false
          load: true
          tags: swiftdrop/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Verify expected image exists
        run: |
          set -euo pipefail
          image="swiftdrop/${{ matrix.service }}:${{ github.sha }}"
          if ! docker image inspect "$image" >/dev/null 2>&1; then
            echo "::error::Expected image ${image} was not built or loaded by the build step."
            exit 1
          fi

      - name: Install pinned Syft
        run: bash scripts/install-syft.sh

      - name: Generate SBOM
        env:
          SYFT_CHECK_FOR_APP_UPDATE: 'false'
        run: |
          set -euo pipefail
          syft version
          output="sbom-${{ matrix.service }}-${{ github.sha }}.cdx.json"
          syft scan \
            "swiftdrop/${{ matrix.service }}:${{ github.sha }}" \
            -o cyclonedx-json > "${output}"
          test -s "${output}"

      - name: Upload SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom-${{ matrix.service }}-${{ github.sha }}
          path: sbom-${{ matrix.service }}-${{ github.sha }}.cdx.json
          if-no-files-found: error
          retention-days: 7

      - name: Scan image for HIGH and CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.1
          scan-type: image
          image-ref: swiftdrop/${{ matrix.service }}:${{ github.sha }}
          format: table
          output: trivy-${{ matrix.service }}-${{ github.sha }}.txt
          exit-code: 1
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          vuln-type: os,library
          trivy-config: .github/trivy.yaml
          timeout: 15m

      - name: Show vulnerability report
        if: always()
        run: |
          report="trivy-${{ matrix.service }}-${{ github.sha }}.txt"
          if [ -f "$report" ]; then
            cat "$report"
          else
            echo "Trivy report ${report} was not produced."
          fi

      - name: Upload vulnerability report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: trivy-${{ matrix.service }}-${{ github.sha }}
          path: trivy-${{ matrix.service }}-${{ github.sha }}.txt
          if-no-files-found: error
          retention-days: 7

  access:
    name: Access tests (Compose stack)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: changes
    if: needs.changes.outputs.access == 'true' || (needs.changes.outputs.services != '[]' && needs.changes.outputs.services != '')
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Prepare local environment
        run: cp .env.example .env

      - name: Build all images
        run: make build

      - name: Start the stack
        run: docker compose up -d --no-build --wait --wait-timeout 600

      - name: Apply database migrations
        run: make migrate

      - name: Verify database baseline
        run: make db-verify

      - name: Run the access tests
        env:
          TEST_BASE_URL: http://localhost:8080
        run: |
          set -euo pipefail
          go test -tags=access -count=1 -v ./tests/access/... | tee access.log

          if ! grep -q -- '--- PASS: TestRoleMatrix' access.log; then
            echo "::error::The role matrix did not run to a pass."
            exit 1
          fi

      - name: Show service logs after a failure
        if: failure()
        run: docker compose logs --tail=100

      - name: Stop the stack
        if: always()
        run: docker compose down -v

  notificationflow:
    name: Notification worker E2E (Compose)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: changes
    if: needs.changes.outputs.notificationflow == 'true'
    env:
      COMPOSE_PROJECT_NAME: swiftdrop-notificationflow
      COMPOSE_FILE: docker-compose.yml:tests/integration/notificationflow/docker-compose.identity.yml
      NOTIFICATIONFLOW_IDENTITY_URL: http://127.0.0.1:18081
      RABBITMQ_RETRY_DELAY: 5s
      RABBITMQ_MAX_RETRIES: '2'
      NOTIFICATIONFLOW_RETRY_WAIT: 60s
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Prepare local environment
        run: cp .env.example .env

      - name: Build the notification worker and identity images
        run: docker compose build notification-worker identity

      - name: Start the dependencies
        run: docker compose up -d --wait --wait-timeout 300 postgres rabbitmq mailpit identity

      - name: Apply database migrations
        run: make migrate

      - name: Start the notification worker
        run: docker compose up -d --wait --wait-timeout 300 notification-worker

      - name: Run the notification worker E2E tests
        run: |
          set -euo pipefail
          go test -race -tags=notificationflow -count=1 -v ./tests/integration/notificationflow/... | tee notificationflow.log

          if grep -q -- '--- SKIP' notificationflow.log; then
            echo "::error::Notification worker E2E tests were skipped; the Compose services must be reachable."
            exit 1
          fi

      - name: Show service logs after a failure
        if: failure()
        run: docker compose logs --tail=200 notification-worker identity mailpit rabbitmq postgres

      - name: Stop the stack
        if: always()
        run: docker compose down -v

  security-gate:
    name: Security gate
    if: always()
    needs:
      - go-security
      - frontend-security
      - secret-security
      - sast
      - docker
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify security job results
        env:
          GO_SECURITY_RESULT: ${{ needs['go-security'].result }}
          FRONTEND_SECURITY_RESULT: ${{ needs['frontend-security'].result }}
          SECRET_SECURITY_RESULT: ${{ needs['secret-security'].result }}
          SAST_RESULT: ${{ needs.sast.result }}
          DOCKER_RESULT: ${{ needs.docker.result }}
        run: |
          set -euo pipefail
          failed=0

          check_required() {
            local name="$1"
            local result="$2"
            if [ "$result" != "success" ]; then
              echo "::error::${name} must succeed, but its result was '${result}'."
              failed=1
            fi
          }

          check_optional() {
            local name="$1"
            local result="$2"
            case "$result" in
              success|skipped) ;;
              *)
                echo "::error::${name} may only succeed or be skipped, but its result was '${result}'."
                failed=1
                ;;
            esac
          }

          check_required "go-security" "$GO_SECURITY_RESULT"
          check_required "frontend-security" "$FRONTEND_SECURITY_RESULT"
          check_required "secret-security" "$SECRET_SECURITY_RESULT"
          check_required "sast" "$SAST_RESULT"
          check_optional "docker" "$DOCKER_RESULT"

          exit "$failed"

  gate:
    name: Required CI gate
    if: always()
    needs:
      - go
      - hygiene
      - integration
      - database
      - frontend
      - e2e
      - changes
      - docker
      - access
      - notificationflow
      - security-gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify required job results
        env:
          GO_RESULT: ${{ needs.go.result }}
          HYGIENE_RESULT: ${{ needs.hygiene.result }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
          DATABASE_RESULT: ${{ needs.database.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          DOCKER_RESULT: ${{ needs.docker.result }}
          ACCESS_RESULT: ${{ needs.access.result }}
          SECURITY_GATE_RESULT: ${{ needs['security-gate'].result }}
          NOTIFICATIONFLOW_RESULT: ${{ needs.notificationflow.result }}
        run: |
          set -euo pipefail
          failed=0

          check_required() {
            local name="$1"
            local result="$2"
            if [ "$result" != "success" ]; then
              echo "::error::${name} must succeed, but its result was '${result}'."
              failed=1
            fi
          }

          check_optional() {
            local name="$1"
            local result="$2"
            case "$result" in
              success|skipped) ;;
              *)
                echo "::error::${name} may only succeed or be skipped, but its result was '${result}'."
                failed=1
                ;;
            esac
          }

          check_required "go" "$GO_RESULT"
          check_required "hygiene" "$HYGIENE_RESULT"
          check_required "integration" "$INTEGRATION_RESULT"
          check_required "database" "$DATABASE_RESULT"
          check_required "frontend" "$FRONTEND_RESULT"
          check_required "e2e" "$E2E_RESULT"
          check_required "changes" "$CHANGES_RESULT"
          check_optional "docker" "$DOCKER_RESULT"
          check_optional "access" "$ACCESS_RESULT"
          check_required "security-gate" "$SECURITY_GATE_RESULT"
          check_optional "notificationflow" "$NOTIFICATIONFLOW_RESULT"

          exit "$failed"

  release:
    name: Release smoke test
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      startsWith(github.ref, 'refs/tags/milestone-')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Prepare local environment
        run: cp .env.example .env

      - name: Build all images
        run: make build

      - name: Start the stack
        run: docker compose up -d --no-build --wait --wait-timeout 600

      - name: Apply database migrations
        run: make migrate

      - name: Verify database baseline
        run: make db-verify

      - name: Verify routes
        run: ./scripts/check-routes.sh

      - name: Stop the stack
        if: always()
        run: docker compose down
