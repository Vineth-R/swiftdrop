name: CI

on:
  push:
    branches:
      - development
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - development
      - main

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: 1
  NX_TELEMETRY_DISABLED: 1

jobs:
  go:
    name: Go checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: |
          set -euo pipefail
          file_count="$(find apps/services packages/go-common tests/integration -type f -name '*.go' | wc -l | tr -d ' ')"
          if [ "$file_count" -eq 0 ]; then
            echo "No Go files found in the expected directories."
            exit 1
          fi

          unformatted="$(find apps/services packages/go-common tests/integration -type f -name '*.go' -exec gofmt -l {} +)"
          if [ -n "$unformatted" ]; then
            echo "The following Go files are not formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test with race detector and coverage
        run: go test -race -covermode=atomic -coverprofile=coverage.out ./...

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: go-coverage
          path: coverage.out
          if-no-files-found: error
          retention-days: 7

      - name: Build
        run: go build ./...

      - name: Validate Docker Compose configuration
        run: docker compose config --quiet

  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - name: Enforce LF line endings for shell scripts
        run: |
          set -euo pipefail
          offenders="$(git ls-files --eol '*.sh' | awk '$1 != "i/lf"')"
          if [ -n "$offenders" ]; then
            echo "::error::Tracked shell scripts must use LF line endings. See .gitattributes."
            echo "$offenders"
            exit 1
          fi

          missing="$(git ls-files -z '*.sh' | xargs -0 git check-attr eol | awk -F': ' '$3 != "lf"')"
          if [ -n "$missing" ]; then
            echo "::error::Shell scripts must match the .gitattributes eol=lf rule."
            echo "$missing"
            exit 1
          fi
          echo "All tracked shell scripts are LF and covered by the eol rule."

  integration:
    name: RabbitMQ integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      rabbitmq:
        image: rabbitmq:4.1-management-alpine
        env:
          RABBITMQ_DEFAULT_USER: swiftdrop
          RABBITMQ_DEFAULT_PASS: swiftdrop
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      RABBITMQ_URL: amqp://swiftdrop:swiftdrop@127.0.0.1:5672/
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Wait for RabbitMQ
        run: |
          set -euo pipefail
          if [ -z "${RABBITMQ_URL}" ]; then
            echo "::error::RABBITMQ_URL must be set; integration tests skip without it."
            exit 1
          fi

          timeout 60 bash -c 'until (echo >/dev/tcp/127.0.0.1/5672) 2>/dev/null; do sleep 1; done'

      - name: Run integration tests
        run: |
          set -euo pipefail
          go test -race -count=1 -tags=integration -v ./tests/integration | tee integration.log

          if grep -q -- '--- SKIP' integration.log; then
            echo "::error::RabbitMQ integration tests were skipped; the broker must be reachable."
            exit 1
          fi

  database:
    name: PostgreSQL integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: swiftdrop
          POSTGRES_PASSWORD: swiftdrop
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U swiftdrop -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://swiftdrop:swiftdrop@127.0.0.1:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Wait for PostgreSQL
        run: |
          set -euo pipefail
          if [ -z "${TEST_DATABASE_URL}" ]; then
            echo "::error::TEST_DATABASE_URL must be set; database tests skip without it."
            exit 1
          fi

          timeout 60 bash -c 'until (echo >/dev/tcp/127.0.0.1/5432) 2>/dev/null; do sleep 1; done'

      - name: Run database integration tests
        run: |
          set -euo pipefail
          go test -race -count=1 -tags=integration -v ./tests/integration/database/... | tee database.log

          if grep -q -- '--- SKIP' database.log; then
            echo "::error::PostgreSQL integration tests were skipped; the database must be reachable."
            exit 1
          fi

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 12.15.0

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint and build web
        run: pnpm exec nx run-many -t lint build --projects=@org/web,@org/web-e2e

      - name: Typecheck e2e
        run: pnpm exec nx typecheck @org/web-e2e

  e2e:
    name: Playwright E2E (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: true
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 12.15.0

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Playwright E2E
        run: pnpm exec nx run @org/web-e2e:e2e --args="--project=chromium"

  changes:
    name: Detect changed projects
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.filter.outputs.changes }}
    steps:
      - uses: actions/checkout@v5

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            identity:
              - 'apps/services/identity/**'
              - 'packages/go-common/**'
              - 'go.mod'
              - 'go.sum'
              - 'infra/docker/go.Dockerfile'
              - '.dockerignore'
            parcel:
              - 'apps/services/parcel/**'
              - 'packages/go-common/**'
              - 'go.mod'
              - 'go.sum'
              - 'infra/docker/go.Dockerfile'
              - '.dockerignore'
            pricing:
              - 'apps/services/pricing/**'
              - 'packages/go-common/**'
              - 'go.mod'
              - 'go.sum'
              - 'infra/docker/go.Dockerfile'
              - '.dockerignore'
            merchant:
              - 'apps/services/merchant/**'
              - 'packages/go-common/**'
              - 'go.mod'
              - 'go.sum'
              - 'infra/docker/go.Dockerfile'
              - '.dockerignore'
            realtime:
              - 'apps/services/realtime/**'
              - 'packages/go-common/**'
              - 'go.mod'
              - 'go.sum'
              - 'infra/docker/go.Dockerfile'
              - '.dockerignore'
            notification-worker:
              - 'apps/services/notification-worker/**'
              - 'packages/go-common/**'
              - 'go.mod'
              - 'go.sum'
              - 'infra/docker/go.Dockerfile'
              - '.dockerignore'
            webhook-worker:
              - 'apps/services/webhook-worker/**'
              - 'packages/go-common/**'
              - 'go.mod'
              - 'go.sum'
              - 'infra/docker/go.Dockerfile'
              - '.dockerignore'
            web:
              - 'apps/web/**'
              - 'infra/docker/web.Dockerfile'
              - '.dockerignore'
              - 'pnpm-lock.yaml'
              - 'package.json'

  docker:
    name: Docker build (${{ matrix.service }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: changes
    if: needs.changes.outputs.services != '[]' && needs.changes.outputs.services != ''
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.services) }}
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Build Go service image
        if: matrix.service != 'web'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/go.Dockerfile
          build-args: |
            SERVICE=${{ matrix.service }}
          push: false
          load: false
          cache-from: type=gha,scope=go
          cache-to: type=gha,mode=max,scope=go

      - name: Build web image
        if: matrix.service == 'web'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/web.Dockerfile
          push: false
          load: false
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  release:
    name: Release smoke test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Build all images and start the stack
        env:
          COMPOSE_PARALLEL_LIMIT: 1
        run: docker compose up -d --build --wait --wait-timeout 600

      - name: Verify routes
        run: ./scripts/check-routes.sh

      - name: Stop the stack
        if: always()
        run: docker compose down
