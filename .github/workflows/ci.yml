name: CI

on:
  push:
    branches:
      - development
      - main
    tags:
      - 'v*'
      - 'milestone-*'
  pull_request:
    branches:
      - development
      - main

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: 1
  NX_TELEMETRY_DISABLED: 1

jobs:
  go:
    name: Go checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: |
          set -euo pipefail
          file_count="$(find apps/services packages/go-common tests -type f -name '*.go' | wc -l | tr -d ' ')"
          if [ "$file_count" -eq 0 ]; then
            echo "No Go files found in the expected directories."
            exit 1
          fi

          unformatted="$(find apps/services packages/go-common tests -type f -name '*.go' -exec gofmt -l {} +)"
          if [ -n "$unformatted" ]; then
            echo "The following Go files are not formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test with race detector and coverage
        run: ./scripts/coverage.sh

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: go-coverage
          path: |
            coverage.out
            coverage-summary.md
          if-no-files-found: error
          retention-days: 7

      - name: Build
        run: go build ./...

      - name: Validate shared router and logger adoption
        run: go test ./tests/architecture -run TestRepositorySharedInfrastructure -v

      - name: Validate Docker Compose configuration
        run: docker compose config --quiet

      - name: Validate worker healthchecks
        run: |
          set -euo pipefail
          if grep -n 'pgrep -f /usr/local/bin/service' docker-compose.yml; then
            echo "::error::Worker healthchecks must match the service process, not the healthcheck shell command line."
            exit 1
          fi
          test "$(grep -c 'pgrep -x /usr/local/bin/service' docker-compose.yml)" -ge 2

  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - name: Enforce LF line endings for shell scripts
        run: |
          set -euo pipefail
          offenders="$(git ls-files --eol '*.sh' | awk '$1 != "i/lf"')"
          if [ -n "$offenders" ]; then
            echo "::error::Tracked shell scripts must use LF line endings. See .gitattributes."
            echo "$offenders"
            exit 1
          fi

          missing="$(git ls-files -z '*.sh' | xargs -0 git check-attr eol | awk -F': ' '$3 != "lf"')"
          if [ -n "$missing" ]; then
            echo "::error::Shell scripts must match the .gitattributes eol=lf rule."
            echo "$missing"
            exit 1
          fi
          echo "All tracked shell scripts are LF and covered by the eol rule."

  integration:
    name: RabbitMQ integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      rabbitmq:
        image: rabbitmq:4.1-management-alpine
        env:
          RABBITMQ_DEFAULT_USER: swiftdrop
          RABBITMQ_DEFAULT_PASS: swiftdrop
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      RABBITMQ_URL: amqp://swiftdrop:swiftdrop@127.0.0.1:5672/
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Wait for RabbitMQ
        run: |
          set -euo pipefail
          if [ -z "${RABBITMQ_URL}" ]; then
            echo "::error::RABBITMQ_URL must be set; integration tests skip without it."
            exit 1
          fi

          timeout 60 bash -c 'until (echo >/dev/tcp/127.0.0.1/5672) 2>/dev/null; do sleep 1; done'

      - name: Run integration tests
        run: |
          set -euo pipefail
          go test -race -count=1 -tags=integration -v ./tests/integration | tee integration.log

          if grep -q -- '--- SKIP' integration.log; then
            echo "::error::RabbitMQ integration tests were skipped; the broker must be reachable."
            exit 1
          fi

  database:
    name: PostgreSQL integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: swiftdrop
          POSTGRES_PASSWORD: swiftdrop
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U swiftdrop -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://swiftdrop:swiftdrop@127.0.0.1:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Wait for PostgreSQL
        run: |
          set -euo pipefail
          if [ -z "${TEST_DATABASE_URL}" ]; then
            echo "::error::TEST_DATABASE_URL must be set; database tests skip without it."
            exit 1
          fi

          timeout 60 bash -c 'until (echo >/dev/tcp/127.0.0.1/5432) 2>/dev/null; do sleep 1; done'

      - name: Run database integration tests
        run: |
          set -euo pipefail
          go test -race -count=1 -tags=integration -v ./tests/integration/database/... ./apps/services/pricing/internal/http/... ./apps/services/notification-worker/internal/idempotency/... ./apps/services/notification-worker/internal/notificationlog/... ./apps/services/identity/internal/seed/... ./apps/services/merchant/internal/http/... | tee database.log

          if grep -q -- '--- SKIP' database.log; then
            echo "::error::PostgreSQL integration tests were skipped; the database must be reachable."
            exit 1
          fi

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 12.15.0

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test the design lint rules
        run: node --test "apps/web/eslint-rules/*.test.mjs"

      - name: Lint and build web
        run: pnpm exec nx run-many -t lint build --projects=@org/web,@org/web-e2e

      - name: Typecheck e2e
        run: pnpm exec nx typecheck @org/web-e2e

  e2e:
    name: Playwright E2E (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: true
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 12.15.0

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Playwright E2E
        run: pnpm exec nx run @org/web-e2e:e2e --args="--project=chromium"

  changes:
    name: Detect changed projects
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.matrix.outputs.services }}
      access: ${{ steps.filter.outputs.access }}
    steps:
      - uses: actions/checkout@v5

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            identity:
              - 'apps/services/identity/**'
              - 'packages/**'
              - 'go.mod'
              - 'go.sum'
              - 'infra/docker/go.Dockerfile'
              - '.dockerignore'
            parcel:
              - 'apps/services/parcel/**'
              - 'packages/**'
              - 'go.mod'
              - 'go.sum'
              - 'infra/docker/go.Dockerfile'
              - '.dockerignore'
            pricing:
              - 'apps/services/pricing/**'
              - 'packages/**'
              - 'go.mod'
              - 'go.sum'
              - 'infra/docker/go.Dockerfile'
              - '.dockerignore'
            merchant:
              - 'apps/services/merchant/**'
              - 'packages/**'
              - 'go.mod'
              - 'go.sum'
              - 'infra/docker/go.Dockerfile'
              - '.dockerignore'
            realtime:
              - 'apps/services/realtime/**'
              - 'packages/**'
              - 'go.mod'
              - 'go.sum'
              - 'infra/docker/go.Dockerfile'
              - '.dockerignore'
            notification-worker:
              - 'apps/services/notification-worker/**'
              - 'packages/**'
              - 'go.mod'
              - 'go.sum'
              - 'infra/docker/go.Dockerfile'
              - '.dockerignore'
            webhook-worker:
              - 'apps/services/webhook-worker/**'
              - 'packages/**'
              - 'go.mod'
              - 'go.sum'
              - 'infra/docker/go.Dockerfile'
              - '.dockerignore'
            web:
              - 'apps/web/**'
              - 'infra/docker/web.Dockerfile'
              - '.dockerignore'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'package.json'
              - 'nx.json'
              - 'tsconfig.base.json'
              - 'tsconfig.json'
              - 'apps/web-e2e/package.json'
            access:
              - 'docker-compose.yml'
              - 'infra/nginx/**'
              - 'infra/docker/postgres/**'
              - 'migrations/**'
              - 'tests/access/**'
              - 'Makefile'
              - 'scripts/migrate.sh'
              - '.env.example'

      - name: Separate Docker services from access-only changes
        id: matrix
        env:
          CHANGED: ${{ steps.filter.outputs.changes }}
        run: |
          set -euo pipefail
          services="$(jq -c '[.[] | select(. != "access")]' <<< "${CHANGED:-[]}")"
          echo "services=${services}" >> "$GITHUB_OUTPUT"

  docker:
    name: Docker build (${{ matrix.service }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: changes
    if: needs.changes.outputs.services != '[]' && needs.changes.outputs.services != ''
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.services) }}
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Build Go service image
        if: matrix.service != 'web'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/go.Dockerfile
          build-args: |
            SERVICE=${{ matrix.service }}
          push: false
          load: false
          cache-from: type=gha,scope=go
          cache-to: type=gha,mode=max,scope=go

      - name: Build web image
        if: matrix.service == 'web'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/web.Dockerfile
          push: false
          load: false
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  access:
    name: Access tests (Compose stack)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: changes
    if: needs.changes.outputs.access == 'true' || (needs.changes.outputs.services != '[]' && needs.changes.outputs.services != '')
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Prepare local environment
        run: cp .env.example .env

      - name: Build all images
        run: make build

      - name: Start the stack
        run: docker compose up -d --no-build --wait --wait-timeout 600

      - name: Apply database migrations
        run: make migrate

      - name: Verify database baseline
        run: make db-verify

      - name: Run the access tests
        env:
          TEST_BASE_URL: http://localhost:8080
        run: |
          set -euo pipefail
          go test -tags=access -count=1 -v ./tests/access/... | tee access.log

          if ! grep -q -- '--- PASS: TestRoleMatrix' access.log; then
            echo "::error::The role matrix did not run to a pass."
            exit 1
          fi

      - name: Show service logs after a failure
        if: failure()
        run: docker compose logs --tail=100

      - name: Stop the stack
        if: always()
        run: docker compose down -v

  gate:
    name: Required CI gate
    if: always()
    needs:
      - go
      - hygiene
      - integration
      - database
      - frontend
      - e2e
      - changes
      - docker
      - access
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify required job results
        env:
          GO_RESULT: ${{ needs.go.result }}
          HYGIENE_RESULT: ${{ needs.hygiene.result }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
          DATABASE_RESULT: ${{ needs.database.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          DOCKER_RESULT: ${{ needs.docker.result }}
          ACCESS_RESULT: ${{ needs.access.result }}
        run: |
          set -euo pipefail
          failed=0

          check_required() {
            local name="$1"
            local result="$2"
            if [ "$result" != "success" ]; then
              echo "::error::${name} must succeed, but its result was '${result}'."
              failed=1
            fi
          }

          check_optional() {
            local name="$1"
            local result="$2"
            case "$result" in
              success|skipped) ;;
              *)
                echo "::error::${name} may only succeed or be skipped, but its result was '${result}'."
                failed=1
                ;;
            esac
          }

          check_required "go" "$GO_RESULT"
          check_required "hygiene" "$HYGIENE_RESULT"
          check_required "integration" "$INTEGRATION_RESULT"
          check_required "database" "$DATABASE_RESULT"
          check_required "frontend" "$FRONTEND_RESULT"
          check_required "e2e" "$E2E_RESULT"
          check_required "changes" "$CHANGES_RESULT"
          check_optional "docker" "$DOCKER_RESULT"
          check_optional "access" "$ACCESS_RESULT"

          exit "$failed"

  release:
    name: Release smoke test
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      startsWith(github.ref, 'refs/tags/milestone-')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Prepare local environment
        run: cp .env.example .env

      - name: Build all images
        run: make build

      - name: Start the stack
        run: docker compose up -d --no-build --wait --wait-timeout 600

      - name: Apply database migrations
        run: make migrate

      - name: Verify database baseline
        run: make db-verify

      - name: Verify routes
        run: ./scripts/check-routes.sh

      - name: Stop the stack
        if: always()
        run: docker compose down
