name: swiftdrop

x-app-env: &app-env
  APP_ENV: ${APP_ENV:-development}
  LOG_LEVEL: ${LOG_LEVEL:-info}

x-go-build: &go-build
  context: .
  dockerfile: infra/docker/go.Dockerfile

x-rabbitmq-env: &rabbitmq-env
  RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER:-swiftdrop}:${RABBITMQ_DEFAULT_PASS:-swiftdrop}@rabbitmq:5672/
  RABBITMQ_EXCHANGE: ${RABBITMQ_EXCHANGE:-swiftdrop.events}
  RABBITMQ_PREFETCH: ${RABBITMQ_PREFETCH:-10}
  RABBITMQ_HANDLER_TIMEOUT: ${RABBITMQ_HANDLER_TIMEOUT:-30s}
  RABBITMQ_MAX_RETRIES: ${RABBITMQ_MAX_RETRIES:-3}
  RABBITMQ_RETRY_DELAY: ${RABBITMQ_RETRY_DELAY:-30s}
  RABBITMQ_RECONNECT_MIN: ${RABBITMQ_RECONNECT_MIN:-1s}
  RABBITMQ_RECONNECT_MAX: ${RABBITMQ_RECONNECT_MAX:-30s}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-swiftdrop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-swiftdrop}
      POSTGRES_DB: ${POSTGRES_DB:-swiftdrop}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/docker/postgres/init/01-schemas.sql:/docker-entrypoint-initdb.d/01-schemas.sql:ro
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    image: migrate/migrate:v4.18.3
    profiles: ["tools"]
    entrypoint: ["migrate"]
    volumes:
      - ./migrations:/migrations:ro
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-swiftdrop}:${POSTGRES_PASSWORD:-swiftdrop}@postgres:5432/${POSTGRES_DB:-swiftdrop}?sslmode=disable

  rabbitmq:
    image: rabbitmq:4.1-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-swiftdrop}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-swiftdrop}
    ports:
      - '${RABBITMQ_PORT:-5672}:5672'
      - '${RABBITMQ_MANAGEMENT_PORT:-15672}:15672'
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 10s
      timeout: 10s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.27
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: '1'
      MP_SMTP_AUTH_ALLOW_INSECURE: '1'
    ports:
      - '${SMTP_PORT:-1025}:1025'
      - '${MAILPIT_UI_PORT:-8025}:8025'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:8025/livez']
      interval: 10s
      timeout: 5s
      retries: 5

  identity:
    build:
      <<: *go-build
      args:
        SERVICE: identity
    environment:
      <<: *app-env
      PORT: '8081'
      DATABASE_URL: postgres://${POSTGRES_USER:-swiftdrop}:${POSTGRES_PASSWORD:-swiftdrop}@postgres:5432/${POSTGRES_DB:-swiftdrop}?sslmode=disable
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-}
      ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:-15m}
      REFRESH_TOKEN_TTL: ${REFRESH_TOKEN_TTL:-168h}
      COOKIE_NAME: ${COOKIE_NAME:-sd_access}
      COOKIE_REFRESH_NAME: ${COOKIE_REFRESH_NAME:-sd_refresh}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      COOKIE_SAMESITE: ${COOKIE_SAMESITE:-lax}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost:8080}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-no-reply@swiftdrop.local}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:8081/ready']
      interval: 10s
      timeout: 5s
      retries: 5

  parcel:
    build:
      <<: *go-build
      args:
        SERVICE: parcel
    environment:
      <<: *app-env
      PORT: '8082'
      DATABASE_URL: postgres://${POSTGRES_USER:-swiftdrop}:${POSTGRES_PASSWORD:-swiftdrop}@postgres:5432/${POSTGRES_DB:-swiftdrop}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:8082/ready']
      interval: 10s
      timeout: 5s
      retries: 5

  pricing:
    build:
      <<: *go-build
      args:
        SERVICE: pricing
    environment:
      <<: *app-env
      PORT: '8083'
      DATABASE_URL: postgres://${POSTGRES_USER:-swiftdrop}:${POSTGRES_PASSWORD:-swiftdrop}@postgres:5432/${POSTGRES_DB:-swiftdrop}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:8083/ready']
      interval: 10s
      timeout: 5s
      retries: 5

  merchant:
    build:
      <<: *go-build
      args:
        SERVICE: merchant
    environment:
      <<: *app-env
      PORT: '8084'
      DATABASE_URL: postgres://${POSTGRES_USER:-swiftdrop}:${POSTGRES_PASSWORD:-swiftdrop}@postgres:5432/${POSTGRES_DB:-swiftdrop}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:8084/ready']
      interval: 10s
      timeout: 5s
      retries: 5

  realtime:
    build:
      <<: *go-build
      args:
        SERVICE: realtime
    environment:
      <<: *app-env
      PORT: '8085'
      DATABASE_URL: postgres://${POSTGRES_USER:-swiftdrop}:${POSTGRES_PASSWORD:-swiftdrop}@postgres:5432/${POSTGRES_DB:-swiftdrop}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:8085/ready']
      interval: 10s
      timeout: 5s
      retries: 5

  notification-worker:
    build:
      <<: *go-build
      args:
        SERVICE: notification-worker
    environment:
      <<: [*app-env, *rabbitmq-env]
      NOTIFICATION_QUEUE: ${NOTIFICATION_QUEUE:-notification.requested.v1}
      NOTIFICATION_ROUTING_KEY: ${NOTIFICATION_ROUTING_KEY:-notification.requested.v1}
    stop_grace_period: 35s
    depends_on:
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'pgrep -f /usr/local/bin/service > /dev/null']
      interval: 10s
      timeout: 5s
      retries: 5

  webhook-worker:
    build:
      <<: *go-build
      args:
        SERVICE: webhook-worker
    environment:
      <<: [*app-env, *rabbitmq-env]
      WEBHOOK_QUEUE: ${WEBHOOK_QUEUE:-webhook.delivery.requested.v1}
      WEBHOOK_ROUTING_KEY: ${WEBHOOK_ROUTING_KEY:-webhook.delivery.requested.v1}
    stop_grace_period: 35s
    depends_on:
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'pgrep -f /usr/local/bin/service > /dev/null']
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
    environment:
      NODE_ENV: production
      PORT: '3000'
      HOSTNAME: 0.0.0.0
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/']
      interval: 15s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:1.27-alpine
    ports:
      - '${NGINX_PORT:-8080}:80'
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      web:
        condition: service_healthy
      identity:
        condition: service_healthy
      parcel:
        condition: service_healthy
      pricing:
        condition: service_healthy
      merchant:
        condition: service_healthy
      realtime:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1/nginx-health']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
  rabbitmq-data:
