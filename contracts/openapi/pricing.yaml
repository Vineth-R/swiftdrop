components:
  schemas:
    HealthResponse:
      type: object
      additionalProperties: false
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - ok
    ReadinessResponse:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - ready
            - unavailable
        checks:
          type: object
          additionalProperties:
            type: string
            enum:
              - ok
              - down
    ErrorResponse:
      type: object
      additionalProperties: false
      required:
        - error
        - meta
      properties:
        error:
          $ref: '#/components/schemas/ErrorDetail'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    ErrorDetail:
      type: object
      additionalProperties: false
      required:
        - code
        - message
      properties:
        code:
          type: string
          description: Stable machine-readable error code from API v1.1.
        message:
          type: string
          description: Human-readable message with no internal implementation details.
        details:
          type: array
          description: Field-level validation details, present only for validation errors.
          items:
            type: object
            additionalProperties: true
    ResponseMeta:
      type: object
      additionalProperties: false
      required:
        - requestId
      properties:
        requestId:
          type: string
          description: Request correlation ID, also returned in the X-Request-Id header.
    SuccessMeta:
      type: object
      additionalProperties: false
      required:
        - requestId
        - timestamp
      properties:
        requestId: *a20
        timestamp: *a23
    QuoteInput:
      type: object
      additionalProperties: false
      required:
        - originZoneId
        - destinationZoneId
        - weightKg
        - sizeCategory
      properties:
        originZoneId: *a9
        destinationZoneId: *a9
        weightKg: *a25
        sizeCategory: *a27
    Quote:
      type: object
      additionalProperties: false
      required:
        - originZoneId
        - destinationZoneId
        - weightKg
        - sizeCategory
        - currency
        - baseFee
        - weightCharge
        - sizeSurcharge
        - total
      properties:
        originZoneId: *a9
        destinationZoneId: *a9
        weightKg: *a25
        sizeCategory: *a27
        currency:
          type: string
          enum:
            - LKR
        baseFee: *a21
        weightCharge: *a21
        sizeSurcharge: *a21
        total: *a21
    Zone:
      type: object
      additionalProperties: false
      required:
        - id
        - code
        - name
        - districts
      properties:
        id: *a9
        code: *a28
        name: *a10
        districts: *a11
    AdminZone:
      type: object
      additionalProperties: false
      required:
        - id
        - code
        - name
        - districts
        - isActive
      properties:
        id: *a9
        code: *a28
        name: *a10
        districts: *a11
        isActive:
          type: boolean
    InternalZone:
      type: object
      additionalProperties: false
      required:
        - id
        - code
        - name
        - isActive
      properties:
        id: *a9
        code: *a20
        name: *a20
        isActive:
          type: boolean
    Rule:
      type: object
      additionalProperties: false
      required:
        - id
        - originZoneId
        - destinationZoneId
        - baseFee
        - currency
        - isActive
        - updatedAt
      properties:
        id: *a9
        originZoneId: *a9
        destinationZoneId: *a9
        baseFee: *a21
        currency:
          type: string
          enum:
            - LKR
        isActive:
          type: boolean
        updatedAt: *a23
    Band:
      type: object
      additionalProperties: false
      required:
        - id
        - minWeightKg
        - maxWeightKg
        - charge
        - isActive
      properties:
        id: *a9
        minWeightKg:
          type: number
          minimum: 0
          maximum: 9999.99
          multipleOf: 0.01
        maxWeightKg: *a25
        charge: *a21
        isActive:
          type: boolean
    Surcharge:
      type: object
      additionalProperties: false
      required:
        - sizeCategory
        - surcharge
      properties:
        sizeCategory: *a27
        surcharge: *a21
    Pagination:
      type: object
      additionalProperties: false
      required:
        - page
        - pageSize
        - totalItems
        - totalPages
      properties:
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          minimum: 1
          maximum: 100
        totalItems:
          type: integer
          minimum: 0
        totalPages:
          type: integer
          minimum: 0
  responses:
    NotFound:
      description: No route matched the request path. Returns the standard error
        envelope with code `NOT_FOUND`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: NOT_FOUND
              message: route not found
            meta:
              requestId: req_01
    MethodNotAllowed:
      description:
        The HTTP method is not allowed for the requested path. Returns the
        standard error envelope with code `METHOD_NOT_ALLOWED`; the `Allow`
        header lists the permitted methods.
      headers:
        Allow:
          description: Comma-separated list of methods allowed for the path.
          schema:
            type: string
          example: GET
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: METHOD_NOT_ALLOWED
              message: method not allowed
            meta:
              requestId: req_01
    InternalServerError:
      description:
        An unexpected server error occurred. Returns the standard error
        envelope with code `INTERNAL_ERROR`; internal details are not exposed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: INTERNAL_ERROR
              message: internal server error
            meta:
              requestId: req_01
  securitySchemes:
    AccessCookie:
      type: apiKey
      in: cookie
      name: sd_access
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: HS256 JWT
    InternalToken:
      type: apiKey
      in: header
      name: X-Internal-Token
