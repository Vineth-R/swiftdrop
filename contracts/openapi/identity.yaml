openapi: 3.0.3
info:
  title: SwiftDrop Identity API
  version: 0.1.0
  description: >-
    Authentication, authorization, and identity profile APIs. This specification
    covers the operational health and readiness endpoints, the authentication
    endpoints (API v1.1 sections 2.1 to 2.6 and 2.16 to 2.17), the signed-in
    user's own profile and password (sections 2.7 to 2.9), the admin user
    endpoints and the courier list (sections 2.10 to 2.15). The service-to-service
    `/internal` endpoints are deliberately not listed here, because the gateway
    never routes them; see docs/identity-internal-api.md. Every response uses
    either the success shape shown below or the standard error envelope
    `{ "error": { "code": "...", "message": "..." }, "meta": { "requestId": "..." } }`. Unmatched routes return
    `404 NOT_FOUND`, disallowed methods return `405 METHOD_NOT_ALLOWED` with an
    `Allow` header, and unexpected failures return `500 INTERNAL_ERROR`.
servers:
  - url: /api/v1/auth
  - url: /api/v1/users
  - url: /api/v1/admin/users
  - url: /api/v1/couriers
paths:
  /health:
    get:
      operationId: identityHealth
      summary: Process health
      responses:
        '200':
          description: The service process is healthy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                status: ok
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /ready:
    get:
      operationId: identityReady
      summary: Service readiness
      responses:
        '200':
          description: The service is ready. The database check is reported when DATABASE_URL is configured.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'
              example:
                status: ready
                checks:
                  database: ok
        '503':
          description: A dependency check is down.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'
              example:
                status: unavailable
                checks:
                  database: down
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /auth/register:
    post:
      operationId: identityRegister
      summary: Register a customer account (API v1.1 section 2.1)
      description: >-
        Creates a CUSTOMER account. Rate limited to 10 requests per minute per
        client address, shared with `/auth/login`. The email is stored in lower
        case and matched without regard to letter case.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Account created. No session is started.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: An account already uses this email (`EMAIL_ALREADY_EXISTS`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /auth/login:
    post:
      operationId: identityLogin
      summary: Log in with email and password (API v1.1 section 2.2)
      description: >-
        Sets the HttpOnly cookies `sd_access` (15 minutes) and `sd_refresh`
        (7 days, path `/api/v1/auth`). An unknown email and a wrong password
        return the same 401. Five consecutive wrong passwords lock the account
        for 15 minutes (423). Send `X-Token-Mode: body` to also receive the
        tokens in the response body. Rate limited to 10 requests per minute per
        client address, shared with `/auth/register`.
      parameters:
        - $ref: '#/components/parameters/TokenMode'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Signed in.
          headers:
            Set-Cookie:
              description: The `sd_access` and `sd_refresh` cookies.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Wrong email or password (`INVALID_CREDENTIALS`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The account was deactivated (`ACCOUNT_DISABLED`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/ValidationError'
        '423':
          description: Too many failed logins (`ACCOUNT_LOCKED`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /auth/refresh:
    post:
      operationId: identityRefresh
      summary: Rotate the refresh token (API v1.1 section 2.3)
      description: >-
        Reads the `sd_refresh` cookie (or `refreshToken` in the body when
        `X-Token-Mode: body` is sent), revokes it and issues a new access and
        refresh token. A used, expired or revoked token returns 401 and the
        cookies are cleared. A token that was already rotated and is presented
        again more than 10 seconds later is treated as stolen: every token
        that descends from it is revoked, which ends that session. The
        response is the same 401, and the user's other logins are untouched.
      parameters:
        - $ref: '#/components/parameters/TokenMode'
      requestBody:
        required: false
        description: Needed only in token mode.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: New tokens issued.
          headers:
            Set-Cookie:
              description: The rotated `sd_access` and `sd_refresh` cookies.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: The refresh token is not valid (`REFRESH_TOKEN_INVALID`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /auth/logout:
    post:
      operationId: identityLogout
      summary: Log out (API v1.1 section 2.4)
      description: >-
        Revokes the caller's current refresh token and clears both cookies.
        Requires a valid access token (cookie or Bearer header). It never fails
        because the refresh token is missing or unknown.
      parameters:
        - $ref: '#/components/parameters/TokenMode'
      requestBody:
        required: false
        description: Optional `refreshToken`, used only in token mode.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '204':
          description: Signed out. No body.
        '401':
          description: >-
            No valid access token (`UNAUTHENTICATED`, or `TOKEN_EXPIRED` when the
            access token has expired and should be refreshed).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /auth/google/login:
    get:
      operationId: identityGoogleLogin
      summary: Start Google sign-in (API v1.1 section 2.5)
      description: >-
        Saves a random one-time `state` (configured `OAUTH_STATE_TTL`, default 10
        minutes) with a PKCE verifier
        and the SHA-256 hash of a browser-binding value, sets the short-lived
        HttpOnly `sd_oauth_binding_<state prefix>` cookie (SameSite=Lax,
        Path=/api/v1/auth/google, Secure in production) and redirects the browser
        to Google's consent page. The route exists only when `GOOGLE_CLIENT_ID`,
        `GOOGLE_CLIENT_SECRET` and `GOOGLE_REDIRECT_URI` are all set; otherwise it
        returns `404 NOT_FOUND`.
      parameters:
        - name: redirectTo
          in: query
          required: false
          description: >-
            Relative frontend path to return to after sign-in, such as
            `/dashboard`. Absolute URLs, `//host` and backslashes are refused.
          schema:
            type: string
            maxLength: 255
            example: /dashboard
      responses:
        '302':
          description: Redirect to `https://accounts.google.com/o/oauth2/v2/auth`.
          headers:
            Location:
              schema:
                type: string
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /auth/google/callback:
    get:
      operationId: identityGoogleCallback
      summary: Finish Google sign-in (API v1.1 section 2.6)
      description: >-
        Requires the browser-binding cookie set by the login endpoint. Checks and
        burns the `state` with the binding hash and expiry in one statement;
        a missing or mismatched binding is rejected without consuming the state.
        Exchanges the code, verifies the ID token, finds the user by `google_sub`
        and then by email, or creates a CUSTOMER with `auth_provider=GOOGLE` and
        no password. When an unverified email account is linked, its password is
        cleared and its refresh tokens are revoked; a password reset restores
        password login. Sets the `sd_access` and `sd_refresh` cookies and clears
        the binding cookie. A browser is redirected on success and on failure.
        A caller that sends `Accept: application/json` (and not `text/html`) gets
        the JSON errors instead.
      parameters:
        - name: code
          in: query
          required: false
          description: Authorization code from Google. Absent when Google sends `error`.
          schema:
            type: string
        - name: state
          in: query
          required: true
          schema:
            type: string
            maxLength: 64
        - name: error
          in: query
          required: false
          description: Sent by Google when sign-in was refused.
          schema:
            type: string
      responses:
        '302':
          description: >-
            Success: redirect to the saved relative `redirectTo` (default
            `/dashboard`) with the session cookies set. Failure: redirect to
            `/login?error=oauth_failed` with no cookies.
          headers:
            Location:
              schema:
                type: string
            Set-Cookie:
              description: The `sd_access` and `sd_refresh` cookies (success only).
              schema:
                type: string
        '400':
          description: The state is missing, unknown, expired or used (`OAUTH_STATE_INVALID`). JSON callers only.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: >-
            The account is disabled (`ACCOUNT_DISABLED`) or Google did not verify
            the email (`FORBIDDEN`). JSON callers only.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          description: Google failed or returned an unusable response (`OAUTH_PROVIDER_ERROR`). JSON callers only.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/forgot-password:
    post:
      operationId: identityForgotPassword
      summary: Request a password reset link (API v1.1 section 2.16)
      description: >-
        Emails a single-use link that expires after `PASSWORD_RESET_TOKEN_TTL`
        (default 30 minutes) and replaces any
        earlier link. The reply is always the same 202 for a well-formed email,
        whether or not an account exists, and Google-only or disabled accounts
        silently receive nothing. Limited to 5 requests per minute per client
        address and per email. The route exists only when `SMTP_HOST` and a valid
        `FRONTEND_BASE_URL` are configured; otherwise it returns `404 NOT_FOUND`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
      responses:
        '202':
          description: The same reply for every well-formed email.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageEnvelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /auth/reset-password:
    post:
      operationId: identityResetPassword
      summary: Set a new password with a reset token (API v1.1 section 2.17)
      description: >-
        Spends the token and sets the new password in one transaction, clears any
        login lock and revokes every refresh token of the user. An unknown,
        expired or already used token (a missing one too) returns the same
        `400 INVALID_OR_EXPIRED_RESET_TOKEN`. The token is checked first and the
        new password second, as API v1.1 section 2.17 orders them; a password
        that breaks the registration rules returns `422` and leaves the token
        unspent. Limited to 5 requests per minute per client address.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '200':
          description: Password changed. The session cookies are cleared.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageEnvelope'
        '400':
          description: >-
            Malformed JSON (`BAD_REQUEST`), or the token is missing, invalid, expired
            or already used (`INVALID_OR_EXPIRED_RESET_TOKEN`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /users/me:
    get:
      operationId: identityGetMe
      summary: Read the signed-in user's own account (API v1.1 section 2.7)
      description: >-
        Any signed-in role. The user is always the one in the access token; no
        id is read from the request. It reads the database, so an account that
        was deleted or deactivated after the token was issued is refused at
        once.
      responses:
        '200':
          description: The signed-in user's account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileEnvelope'
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    patch:
      operationId: identityUpdateMe
      summary: Update the signed-in user's name and phone (API v1.1 section 2.8)
      description: >-
        Any signed-in role. Send any subset of `fullName` and `phone`; at least
        one is required, and a field that is left out (or `null`) stays
        unchanged. Any other field in the body, such as `email` or `role`, is
        ignored: the email and role cannot be changed here.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: The updated account, in the shape of `GET /users/me`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileEnvelope'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /users/me/password:
    put:
      operationId: identityChangePassword
      summary: Change the signed-in user's own password (API v1.1 section 2.9)
      description: >-
        For accounts that have a password. The current password is checked first,
        then the new one against the registration rules. On success the new
        password is stored, any login lock is cleared and every refresh token of
        the user is revoked, so every session ends once its access token runs out
        (at most 15 minutes). This browser's cookies are cleared too, so the
        caller signs in again with the new password. A failed attempt changes
        nothing and keeps the session. Limited to 5 requests per minute per user.
        People who forgot their password use `/auth/forgot-password` instead.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '204':
          description: Password changed and every session ended. No body; both cookies are cleared.
        '400': { $ref: '#/components/responses/BadRequest' }
        '401':
          description: >-
            The current password is wrong (`INVALID_CREDENTIALS`), or there is no valid
            access token (`UNAUTHENTICATED`), or the account no longer exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: >-
            The account signs in with Google only and has no password to change
            (`PASSWORD_NOT_SET`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /admin/users:
    get:
      operationId: identityAdminListUsers
      summary: List users (API v1.1 section 2.10, ADMIN)
      description: Paginated, filterable list. Sorted newest first unless `sort` says otherwise.
      parameters:
        - { name: role, in: query, required: false, schema: { $ref: '#/components/schemas/Role' } }
        - { name: isActive, in: query, required: false, schema: { type: boolean } }
        - name: q
          in: query
          required: false
          description: Case-insensitive search of full name and email. `%` and `_` match themselves.
          schema: { type: string, maxLength: 100 }
        - name: sort
          in: query
          required: false
          description: '`createdAt`, `fullName` or `email`, optionally followed by `:asc` or `:desc`. Default `createdAt:desc`.'
          schema: { type: string, example: 'createdAt:desc' }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: One page of users.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserListEnvelope'
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    post:
      operationId: identityAdminCreateUser
      summary: Create a staff account (API v1.1 section 2.11, ADMIN)
      description: >-
        Creates a courier, dispatcher or admin account and writes a `USER_CREATED`
        audit row in the same transaction. `courierProfile` is required when the role
        is `COURIER` and refused otherwise.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateStaffRequest'
      responses:
        '201':
          description: The created user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserEnvelope'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: The email is already registered (`EMAIL_ALREADY_EXISTS`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /admin/users/{userId}:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      operationId: identityAdminGetUser
      summary: Get one user (API v1.1 section 2.12, ADMIN)
      responses:
        '200':
          description: The full administrative view, with `courierProfile` for couriers.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserEnvelope'
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    patch:
      operationId: identityAdminUpdateUser
      summary: Update a user (API v1.1 section 2.13, ADMIN)
      description: >-
        Any subset of `fullName`, `phone`, `role` and `courierProfile`; at least one is
        required. Writes a `USER_UPDATED` audit row. An admin cannot change their own
        role (`409 CONFLICT`), the `MERCHANT` role cannot be assigned or changed, and a
        user cannot be made a `COURIER` without a `courierProfile`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: The updated user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserEnvelope'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: An admin tried to change their own role (`CONFLICT`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /admin/users/{userId}/status:
    parameters:
      - $ref: '#/components/parameters/UserId'
    patch:
      operationId: identityAdminSetUserStatus
      summary: Activate or deactivate a user (API v1.1 section 2.14, ADMIN)
      description: >-
        Deactivation revokes every refresh token of the user, so no session can be
        renewed and the user cannot sign in. Writes a `USER_ACTIVATED` or
        `USER_DEACTIVATED` audit row.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [isActive]
              properties:
                isActive: { type: boolean }
      responses:
        '200':
          description: The new status.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [id, isActive]
                    properties:
                      id: { type: string, format: uuid }
                      isActive: { type: boolean }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: An admin tried to deactivate their own account (`CANNOT_DEACTIVATE_SELF`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /couriers:
    get:
      operationId: identityListCouriers
      summary: List active couriers for assignment (API v1.1 section 2.15, DISPATCHER and ADMIN)
      parameters:
        - { name: isAvailable, in: query, required: false, schema: { type: boolean } }
        - { name: zoneId, in: query, required: false, description: Home zone, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: One page of active couriers, ordered by name.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourierListEnvelope'
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/InternalServerError' }

components:
  parameters:
    Page:
      name: page
      in: query
      required: false
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: pageSize
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    UserId:
      name: userId
      in: path
      required: true
      schema: { type: string, format: uuid }
    TokenMode:
      name: X-Token-Mode
      in: header
      required: false
      description: Send `body` to receive tokens in the response body (for Postman and automated tests).
      schema:
        type: string
        enum: [body]
  schemas:
    RegisterRequest:
      type: object
      required: [email, password, fullName, phone]
      properties:
        email:
          type: string
          format: email
          maxLength: 255
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 72
          description: At least 8 characters with an upper case letter, a lower case letter and a digit.
        fullName:
          type: string
          minLength: 2
          maxLength: 150
        phone:
          type: string
          description: E.164 format.
          example: '+94771234567'
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
        password:
          type: string
          format: password
    RefreshRequest:
      type: object
      properties:
        refreshToken:
          type: string
    ForgotPasswordRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
          maxLength: 255
    ResetPasswordRequest:
      type: object
      required: [token, newPassword]
      properties:
        token:
          type: string
          description: The `token` query parameter from the emailed link.
        newPassword:
          type: string
          format: password
          minLength: 8
          maxLength: 72
    MessageEnvelope:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [message]
          properties:
            message:
              type: string
        meta:
          type: object
          required: [requestId, timestamp]
          properties:
            requestId:
              type: string
            timestamp:
              type: string
              format: date-time
    Account:
      type: object
      required: [id, email, fullName, role]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        fullName:
          type: string
        phone:
          type: string
        role:
          type: string
          enum: [CUSTOMER, MERCHANT, COURIER, DISPATCHER, ADMIN]
        createdAt:
          type: string
          format: date-time
    SuccessMeta:
      type: object
      required: [requestId, timestamp]
      properties:
        requestId:
          type: string
        timestamp:
          type: string
          format: date-time
    AccountEnvelope:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: '#/components/schemas/Account'
        meta:
          $ref: '#/components/schemas/SuccessMeta'
    Session:
      type: object
      required: [expiresIn]
      properties:
        user:
          $ref: '#/components/schemas/Account'
        expiresIn:
          type: integer
          description: Access token lifetime in seconds.
          example: 900
        accessToken:
          type: string
          description: Present only in token mode (header X-Token-Mode set to body).
        refreshToken:
          type: string
          description: Present only in token mode (header X-Token-Mode set to body).
    SessionEnvelope:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: '#/components/schemas/Session'
        meta:
          $ref: '#/components/schemas/SuccessMeta'
    HealthResponse:
      type: object
      additionalProperties: false
      required:
        - status
      properties:
        status:
          type: string
          enum: [ok]
    ReadinessResponse:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum: [ready, unavailable]
        checks:
          type: object
          additionalProperties:
            type: string
            enum: [ok, down]
    Role:
      type: string
      enum: [CUSTOMER, MERCHANT, COURIER, DISPATCHER, ADMIN]
    Pagination:
      type: object
      required: [page, pageSize, totalItems, totalPages]
      properties:
        page: { type: integer }
        pageSize: { type: integer }
        totalItems: { type: integer }
        totalPages: { type: integer }
    ListMeta:
      type: object
      required: [requestId, timestamp, pagination]
      properties:
        requestId: { type: string }
        timestamp: { type: string, format: date-time }
        pagination:
          $ref: '#/components/schemas/Pagination'
    AdminUserItem:
      type: object
      required: [id, email, fullName, phone, role, isActive, createdAt]
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        fullName: { type: string }
        phone: { type: string, description: Empty when the user has none. }
        role:
          $ref: '#/components/schemas/Role'
        isActive: { type: boolean }
        createdAt: { type: string, format: date-time }
    CourierProfile:
      type: object
      required: [vehicleType, vehicleNumber, homeZoneId, isAvailable]
      properties:
        vehicleType: { type: string, nullable: true, maxLength: 30, example: BIKE }
        vehicleNumber: { type: string, nullable: true, maxLength: 20, example: BCD-4521 }
        homeZoneId: { type: string, format: uuid, nullable: true }
        isAvailable: { type: boolean }
    AdminUser:
      allOf:
        - $ref: '#/components/schemas/AdminUserItem'
        - type: object
          required: [lastLoginAt, updatedAt]
          properties:
            courierProfile:
              $ref: '#/components/schemas/CourierProfile'
            lastLoginAt: { type: string, format: date-time, nullable: true }
            updatedAt: { type: string, format: date-time }
    Profile:
      type: object
      required: [id, email, fullName, phone, role, authProvider, createdAt]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        fullName:
          type: string
        phone:
          type: string
          description: E.164 format. Empty when the account has none (a Google sign-up).
        role:
          type: string
          enum: [CUSTOMER, MERCHANT, COURIER, DISPATCHER, ADMIN]
        authProvider:
          type: string
          enum: [LOCAL, GOOGLE]
        createdAt:
          type: string
          format: date-time
    ProfileEnvelope:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: '#/components/schemas/Profile'
        meta:
          $ref: '#/components/schemas/SuccessMeta'
    UpdateProfileRequest:
      type: object
      minProperties: 1
      properties:
        fullName: { type: string, minLength: 2, maxLength: 150, example: Nimal P. Perera }
        phone: { type: string, description: E.164 format., example: '+94771234000' }
    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
          format: password
        newPassword:
          type: string
          format: password
          minLength: 8
          maxLength: 72
          description: Same rules as registration, with at most 72 bytes.
    AdminUserEnvelope:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: '#/components/schemas/AdminUser'
        meta:
          type: object
          properties:
            requestId: { type: string }
            timestamp: { type: string, format: date-time }
    AdminUserListEnvelope:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AdminUserItem'
        meta:
          $ref: '#/components/schemas/ListMeta'
    CreateStaffRequest:
      type: object
      required: [email, password, fullName, phone, role]
      properties:
        email: { type: string, format: email, maxLength: 255 }
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 72
          description: Same rules as registration. The caller should ask the new user to change it.
        fullName: { type: string, minLength: 2, maxLength: 150 }
        phone: { type: string, description: E.164 format., example: '+94712223344' }
        role:
          type: string
          enum: [COURIER, DISPATCHER, ADMIN]
        courierProfile:
          type: object
          description: Required when `role` is `COURIER`, refused otherwise.
          properties:
            vehicleType: { type: string, maxLength: 30 }
            vehicleNumber: { type: string, maxLength: 20 }
            homeZoneId: { type: string, format: uuid }
    UpdateUserRequest:
      type: object
      description: Any subset of the fields; at least one is required.
      properties:
        fullName: { type: string, minLength: 2, maxLength: 150 }
        phone: { type: string, description: E.164 format. }
        role:
          type: string
          enum: [CUSTOMER, COURIER, DISPATCHER, ADMIN]
        courierProfile:
          type: object
          properties:
            vehicleType: { type: string, maxLength: 30 }
            vehicleNumber: { type: string, maxLength: 20 }
            homeZoneId: { type: string, format: uuid }
            isAvailable: { type: boolean }
    CourierListItem:
      type: object
      required: [id, fullName, phone, vehicleType, homeZoneId, isAvailable]
      properties:
        id: { type: string, format: uuid }
        fullName: { type: string }
        phone: { type: string }
        vehicleType: { type: string, nullable: true }
        homeZoneId: { type: string, format: uuid, nullable: true }
        isAvailable: { type: boolean }
    CourierListEnvelope:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/CourierListItem'
        meta:
          $ref: '#/components/schemas/ListMeta'
    ErrorResponse:
      type: object
      additionalProperties: false
      required:
        - error
        - meta
      properties:
        error:
          $ref: '#/components/schemas/ErrorDetail'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    ErrorDetail:
      type: object
      additionalProperties: false
      required:
        - code
        - message
      properties:
        code:
          type: string
          description: Stable machine-readable error code from API v1.1.
        message:
          type: string
          description: Human-readable message with no internal implementation details.
        details:
          type: array
          description: Field-level validation details, present only for validation errors.
          items:
            type: object
            additionalProperties: true
    ResponseMeta:
      type: object
      additionalProperties: false
      required:
        - requestId
      properties:
        requestId:
          type: string
          description: Request correlation ID, also returned in the X-Request-Id header.
  responses:
    BadRequest:
      description: The body is not valid JSON (`BAD_REQUEST`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    PayloadTooLarge:
      description: The body is over 16 KiB (`PAYLOAD_TOO_LARGE`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UnsupportedMediaType:
      description: The content type is not `application/json` (`UNSUPPORTED_MEDIA_TYPE`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ValidationError:
      description: >-
        One or more fields are invalid (`VALIDATION_ERROR`). `details` lists
        each field and the problem, never the submitted value.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: VALIDATION_ERROR
              message: One or more fields are invalid.
              details:
                - field: password
                  issue: must be at least 8 characters
            meta:
              requestId: req_01
    RateLimited:
      description: Too many requests (`RATE_LIMITED`).
      headers:
        Retry-After:
          description: Seconds to wait before retrying.
          schema:
            type: integer
        X-RateLimit-Remaining:
          description: Requests left in the current window.
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthenticated:
      description: >-
        No valid access token (`UNAUTHENTICATED`, or `TOKEN_EXPIRED` when it has
        expired), or the signed-in account no longer exists.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: >-
        The caller's role may not use this endpoint (`FORBIDDEN`), or the account was
        disabled after the token was issued (`ACCOUNT_DISABLED`). The admin and
        courier endpoints read the caller's current role and active flag from the
        database on every call instead of trusting the role in the token.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: >-
        No route matched the request path. Returns the standard error envelope
        with code `NOT_FOUND`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: NOT_FOUND
              message: route not found
            meta:
              requestId: req_01
    MethodNotAllowed:
      description: >-
        The HTTP method is not allowed for the requested path. Returns the
        standard error envelope with code `METHOD_NOT_ALLOWED`; the `Allow`
        header lists the permitted methods.
      headers:
        Allow:
          description: Comma-separated list of methods allowed for the path.
          schema:
            type: string
          example: GET
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: METHOD_NOT_ALLOWED
              message: method not allowed
            meta:
              requestId: req_01
    InternalServerError:
      description: >-
        An unexpected server error occurred. Returns the standard error envelope
        with code `INTERNAL_ERROR`; internal details are not exposed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: INTERNAL_ERROR
              message: internal server error
            meta:
              requestId: req_01
