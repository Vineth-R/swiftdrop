openapi: 3.0.3
info:
  title: SwiftDrop Identity API
  version: 0.1.0
  description: Authentication, authorization, and identity profile APIs. Initialized with operational endpoints only.
servers:
  - url: /api/v1/identity
paths:
  /healthz:
    get:
      operationId: identityHealth
      summary: Process health
      responses:
        '200':
          description: The service process is healthy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /readyz:
    get:
      operationId: identityReady
      summary: Process readiness
      responses:
        '200':
          description: The service process is ready to accept traffic. Dependency checks are not performed yet.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
components:
  schemas:
    HealthResponse:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          example: ready
