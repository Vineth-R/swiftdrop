  /courier/deliveries:
    get:
      operationId: listCourierDeliveries
      summary: Courier deliveries for a Colombo calendar day (API v1.1 section 6.1)
      description: |
        COURIER only. Uses the verified token subject, never a supplied courier ID.
        Returns currently assigned active parcels regardless of date, plus DELIVERED
        or FAILED parcels completed in the selected Asia/Colombo day. Completion
        bounds are inclusive at midnight and exclusive at the following midnight.
        Optional status filters this set. Sorted by current assignment time descending,
        then parcel ID for stable pagination. Unknown, repeated or empty query values
        are rejected. Responses, including errors, carry Cache-Control no-store.
      tags: [Courier]
      security:
        - AccessCookie: []
        - BearerAuth: []
      parameters:
        - in: query
          name: date
          description: Calendar date; defaults to today in Asia/Colombo.
          schema: { type: string, format: date }
        - in: query
          name: status
          schema:
            type: string
            enum:
              [
                CREATED,
                PICKED_UP,
                IN_TRANSIT,
                OUT_FOR_DELIVERY,
                DELIVERED,
                FAILED,
              ]
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: pageSize
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: Deliveries, or an empty array with valid pagination metadata.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/CourierDelivery' }
                  meta: { $ref: '#/components/schemas/ListMeta' }
        '400':
          description: BAD_REQUEST. Malformed query string.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401': { $ref: '#/components/responses/CourierUnauthenticated' }
        '403': { $ref: '#/components/responses/CourierForbidden' }
        '422':
          description: VALIDATION_ERROR. Invalid date, status, pagination or unsupported query parameter.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/CourierUnavailable' }
  '/courier/deliveries/{parcelId}':
    get:
      operationId: getCourierDelivery
      summary: Assigned courier delivery detail (API v1.1 section 6.2)
      description: |
        COURIER only. The parcel must currently belong to the verified courier.
        Returns 403 for another courier's or an unassigned parcel and 404 for a
        missing parcel, without contact information in errors. History is oldest
        first (created_at, ID). Proof is the latest proof (created_at, ID), or null.
        No photo path, storage URL, actor user ID or other internal metadata is exposed.
        Ownership and detail reads use one database snapshot. Cache-Control no-store.
      tags: [Courier]
      security:
        - AccessCookie: []
        - BearerAuth: []
      parameters:
        - in: path
          name: parcelId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Authorized delivery, contacts, history and proof metadata.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: '#/components/schemas/CourierDeliveryDetail' }
                  meta: { $ref: '#/components/schemas/SuccessMeta' }
        '400':
          description: BAD_REQUEST. Invalid parcel UUID.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401': { $ref: '#/components/responses/CourierUnauthenticated' }
        '403': { $ref: '#/components/responses/CourierForbidden' }
        '404':
          description: PARCEL_NOT_FOUND.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/CourierUnavailable' }
  '/courier/deliveries/{parcelId}/status':
    post:
      operationId: updateCourierDeliveryStatus
      summary: Update an assigned delivery status (API v1.1 section 6.3)
      description: |
        COURIER only. Locks the parcel, verifies the current courier and current
        assignment, then validates the transition and required fields using the
        shared parcel state machine.
        This generic route now serves FAILED from CREATED, PICKED_UP, IN_TRANSIT
        or OUT_FOR_DELIVERY, the legacy PICKED_UP -> IN_TRANSIT recovery step,
        and IN_TRANSIT -> OUT_FOR_DELIVERY. Proof-backed pickup
        (CREATED -> PICKED_UP) and delivery (OUT_FOR_DELIVERY -> DELIVERED) are
        rejected with 422 PROOF_REQUIRED and must use the pickup and delivery
        endpoints so the proof row, history and outbox commit together.
        DELIVERED and FAILED are terminal. Identical updates return 409.
        Status, history and outbox data commit in one transaction. The relay
        publishes parcel.status_changed.v1 (version 1) after commit; notification
        or webhook delivery never gates this response. Limits count Unicode
        characters. Failure reason and note are trimmed. Cache-Control no-store.
      tags: [Courier]
      security:
        - AccessCookie: []
        - BearerAuth: []
      parameters:
        - in: path
          name: parcelId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CourierStatusUpdate'
      responses:
        '200':
          description: Status, history and pending outbox event committed.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: '#/components/schemas/CourierStatusResult' }
                  meta: { $ref: '#/components/schemas/SuccessMeta' }
        '400':
          description: BAD_REQUEST. Invalid parcel UUID, malformed JSON, unknown fields, multiple JSON values or body exceeding 16 KiB.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401': { $ref: '#/components/responses/CourierUnauthenticated' }
        '403': { $ref: '#/components/responses/CourierForbidden' }
        '404':
          description: PARCEL_NOT_FOUND.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '409':
          description: INVALID_TRANSITION. Skipped, backward, identical or terminal transition.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '422':
          description: >-
            PROOF_REQUIRED when status is PICKED_UP from CREATED or DELIVERED
            (use the pickup or delivery endpoint); FAILURE_REASON_REQUIRED for a
            FAILED reason outside 5–255 trimmed characters; VALIDATION_ERROR for
            an unknown/missing status or note over 500 characters. Ownership is
            checked before these rules.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/CourierUnavailable' }
  '/courier/deliveries/{parcelId}/pickup':
    post:
      operationId: confirmCourierPickup
      summary: Confirm pickup with proof and advance to IN_TRANSIT (API v1.1 section 6.5)
      description: |
        COURIER only. The parcel must be assigned to the caller and CREATED.
        Requires a valid decoded JPEG or PNG photo of at most 5 MiB. One database
        transaction stores the PICKUP proof, the PICKED_UP and IN_TRANSIT history
        rows, both PENDING parcel.status_changed outbox events and the final
        IN_TRANSIT status. The courier performs one action and must not submit a
        second IN_TRANSIT update. A retried request that finds the parcel already
        IN_TRANSIT returns 200 with alreadyApplied=true and creates no duplicate
        proof, history or event rows; the retry's unused upload is deleted.
        A historical PICKED_UP parcel is continued with the generic status route
        and does not repeat the pickup proof. Requests are limited to 30 per
        minute per verified courier and this route extends its body read deadline
        to 60 seconds. Cache-Control no-store.
      tags: [Courier]
      security:
        - AccessCookie: []
        - BearerAuth: []
      parameters:
        - in: path
          name: parcelId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: '#/components/schemas/CourierPickupUpload' }
      responses:
        '200':
          description: Pickup proof, both history rows and both pending events committed.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: '#/components/schemas/CourierWorkflowResult' }
                  meta: { $ref: '#/components/schemas/SuccessMeta' }
        '400':
          description: BAD_REQUEST. Invalid parcel UUID.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401': { $ref: '#/components/responses/CourierUnauthenticated' }
        '403': { $ref: '#/components/responses/CourierForbidden' }
        '404':
          description: PARCEL_NOT_FOUND.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '409':
          description: INVALID_TRANSITION (not CREATED; PICKED_UP history uses the in-transit action) or PROOF_LIMIT_REACHED.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '413':
          description: PAYLOAD_TOO_LARGE. Photo exceeds 5 MiB.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '415':
          description: UNSUPPORTED_MEDIA_TYPE. Request is not multipart/form-data or the photo is not a valid JPEG/PNG.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '422':
          description: PROOF_REQUIRED (no photo) or VALIDATION_ERROR (malformed form, note over 500 characters).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '429':
          description: RATE_LIMITED. More than 30 pickup requests in a minute for the verified courier.
          headers:
            Retry-After:
              schema: { type: integer }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/CourierUnavailable' }
  '/courier/deliveries/{parcelId}/delivery':
    post:
      operationId: confirmCourierDelivery
      summary: Confirm delivery with recipient and proof (API v1.1 section 6.6)
      description: |
        COURIER only. The parcel must be assigned to the caller and
        OUT_FOR_DELIVERY. Requires a non-blank recipient name (max 150), a valid
        decoded JPEG or PNG photo of at most 5 MiB, and an optional note (max
        500). One database transaction stores the DELIVERY proof, the recipient,
        the delivered timestamp, the DELIVERED history row and the PENDING outbox
        event. A retried request for an already DELIVERED parcel returns 200 with
        alreadyApplied=true and creates no duplicate rows. The generic status
        route rejects DELIVERED with 422 PROOF_REQUIRED. Requests are limited to
        30 per minute per verified courier and this route extends its body read
        deadline to 60 seconds. Cache-Control no-store.
      tags: [Courier]
      security:
        - AccessCookie: []
        - BearerAuth: []
      parameters:
        - in: path
          name: parcelId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: '#/components/schemas/CourierDeliveryConfirmation' }
      responses:
        '200':
          description: Delivery proof, recipient and pending event committed.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: '#/components/schemas/CourierWorkflowResult' }
                  meta: { $ref: '#/components/schemas/SuccessMeta' }
        '400':
          description: BAD_REQUEST. Invalid parcel UUID.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401': { $ref: '#/components/responses/CourierUnauthenticated' }
        '403': { $ref: '#/components/responses/CourierForbidden' }
        '404':
          description: PARCEL_NOT_FOUND.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '409':
          description: INVALID_TRANSITION (not OUT_FOR_DELIVERY) or PROOF_LIMIT_REACHED.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '413':
          description: PAYLOAD_TOO_LARGE. Photo exceeds 5 MiB.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '415':
          description: UNSUPPORTED_MEDIA_TYPE. Request is not multipart/form-data or the photo is not a valid JPEG/PNG.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '422':
          description: RECIPIENT_REQUIRED, PROOF_REQUIRED, or VALIDATION_ERROR (malformed form, note over 500 characters).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '429':
          description: RATE_LIMITED. More than 30 delivery requests in a minute for the verified courier.
          headers:
            Retry-After:
              schema: { type: integer }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/CourierUnavailable' }
  '/courier/deliveries/{parcelId}/proof':
    post:
      operationId: createCourierDeliveryProof
      summary: Upload proof for an assigned delivery (API v1.1 section 6.4)
      description: |
        COURIER only. The parcel must currently belong to the authenticated
        courier. At least one of photo, recipientName or note must be present.
        Photos are verified from their decoded content and must be a non-empty,
        valid JPEG or PNG no larger than exactly 5 MiB. Client file names and
        media headers are not trusted. Photos are stored in private Parcel-owned
        storage; the response never exposes a storage key or filesystem path.
        Repeated uploads create distinct proof records up to the configurable
        per-parcel limit (default 20). The parcel row is locked while the current
        assignment and proof count are checked, so neither reassignment nor a
        concurrent upload can race an authorized insert. Requests are limited to
        30 per minute per verified courier, and this route extends its own body
        read deadline to 60 seconds. The public gateway accepts up to 6 MiB so
        multipart overhead does not reject a 5 MiB photo; the application still
        enforces the 5 MiB photo-content limit. Cache-Control no-store.
      tags: [Courier]
      security:
        - AccessCookie: []
        - BearerAuth: []
      parameters:
        - in: path
          name: parcelId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CourierProofUpload'
      responses:
        '201':
          description: Delivery proof stored.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: '#/components/schemas/CourierProofResult' }
                  meta: { $ref: '#/components/schemas/SuccessMeta' }
        '400':
          description: BAD_REQUEST. Invalid parcel UUID.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401': { $ref: '#/components/responses/CourierUnauthenticated' }
        '403': { $ref: '#/components/responses/CourierForbidden' }
        '404':
          description: PARCEL_NOT_FOUND.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '409':
          description: PROOF_LIMIT_REACHED. The parcel already has the configured maximum number of proofs.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '413':
          description: PAYLOAD_TOO_LARGE. Photo exceeds exactly 5 MiB, or the request exceeds the 6 MiB gateway body limit.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '415':
          description: UNSUPPORTED_MEDIA_TYPE. Request is not multipart/form-data, or photo content is not a valid JPEG or PNG.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '422':
          description: VALIDATION_ERROR. No proof field is present, the multipart form is malformed, recipientName exceeds 150 characters or note exceeds 500 characters.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '429':
          description: RATE_LIMITED. More than 30 proof uploads in a minute for the verified courier.
          headers:
            Retry-After:
              schema: { type: integer }
            X-RateLimit-Remaining:
              schema: { type: integer, minimum: 0 }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/CourierUnavailable' }
components:
  parameters:
    ParcelID:
      name: parcelId
      in: path
      required: true
      schema: { type: string, format: uuid }
  schemas:
    ParcelStatus:
      type: string
      enum:
        [CREATED, PICKED_UP, IN_TRANSIT, OUT_FOR_DELIVERY, DELIVERED, FAILED]
    ParcelContact:
      type: object
      additionalProperties: false
      required: [name, phone, address, city, zoneId]
      properties:
        name: { type: string, minLength: 1, maxLength: 150 }
        phone: { type: string, pattern: '^\+[1-9][0-9]{8,14}$' }
        address: { type: string, minLength: 1, maxLength: 255 }
        city: { type: string, minLength: 1, maxLength: 100 }
        zoneId: { type: string, format: uuid }
    ParcelFee:
      type: object
      required: [currency, baseFee, weightCharge, sizeSurcharge, total]
      properties:
        currency: { type: string, enum: [LKR] }
        baseFee: { type: number, minimum: 0, multipleOf: 0.01 }
        weightCharge: { type: number, minimum: 0, multipleOf: 0.01 }
        sizeSurcharge: { type: number, minimum: 0, multipleOf: 0.01 }
        total: { type: number, minimum: 0, multipleOf: 0.01 }
    CustomerParcelInput:
      type: object
      additionalProperties: false
      required: [sender, recipient, weightKg, sizeCategory, expectedFee]
      properties:
        sender: { $ref: '#/components/schemas/ParcelContact' }
        recipient: { $ref: '#/components/schemas/ParcelContact' }
        weightKg:
          { type: number, minimum: 0.01, maximum: 9999.99, multipleOf: 0.01 }
        sizeCategory: { type: string, enum: [SMALL, MEDIUM, LARGE, OVERSIZED] }
        description: { type: string, nullable: true, maxLength: 255 }
        expectedFee:
          { type: number, minimum: 0, maximum: 9999999999.99, multipleOf: 0.01 }
    MerchantParcelInput:
      type: object
      additionalProperties: false
      required:
        [
          merchantId,
          createdByUserId,
          externalOrderId,
          pickup,
          recipient,
          weightKg,
          sizeCategory,
        ]
      properties:
        merchantId: { type: string, format: uuid }
        createdByUserId:
          type: string
          format: uuid
          description: Verified merchant owner's identity user ID, supplied by the trusted Merchant service.
        externalOrderId: { type: string, minLength: 1, maxLength: 100 }
        idempotencyKey: { type: string, maxLength: 100 }
        pickup: { $ref: '#/components/schemas/ParcelContact' }
        recipient: { $ref: '#/components/schemas/ParcelContact' }
        weightKg:
          { type: number, minimum: 0.01, maximum: 9999.99, multipleOf: 0.01 }
        sizeCategory: { type: string, enum: [SMALL, MEDIUM, LARGE, OVERSIZED] }
        description: { type: string, nullable: true, maxLength: 255 }
    CreatedParcel:
      type: object
      required:
        [
          id,
          trackingNumber,
          status,
          sender,
          recipient,
          weightKg,
          sizeCategory,
          description,
          fee,
          createdAt,
        ]
      properties:
        id: { type: string, format: uuid }
        trackingNumber: { type: string, pattern: '^SD[KN][A-Z2-9]{8}$' }
        status: { $ref: '#/components/schemas/ParcelStatus' }
        sender:
          type: object
          required: [name, city]
          properties:
            name: { type: string }
            city: { type: string }
        recipient:
          type: object
          required: [name, city]
          properties:
            name: { type: string }
            city: { type: string }
        weightKg: { type: number }
        sizeCategory: { type: string, enum: [SMALL, MEDIUM, LARGE, OVERSIZED] }
        description: { type: string, nullable: true }
        fee: { $ref: '#/components/schemas/ParcelFee' }
        createdAt: { type: string, format: date-time }
    ParcelDetail:
      type: object
      required:
        [
          id,
          trackingNumber,
          status,
          sender,
          recipient,
          weightKg,
          sizeCategory,
          description,
          fee,
          courier,
          failureReason,
          createdAt,
          updatedAt,
          deliveredAt,
        ]
      properties:
        id: { type: string, format: uuid }
        trackingNumber: { type: string }
        status: { $ref: '#/components/schemas/ParcelStatus' }
        sender: { $ref: '#/components/schemas/ParcelContact' }
        recipient: { $ref: '#/components/schemas/ParcelContact' }
        weightKg: { type: number }
        sizeCategory: { type: string }
        description: { type: string, nullable: true }
        fee: { $ref: '#/components/schemas/ParcelFee' }
        courier:
          type: object
          nullable: true
          required: [fullName, phone]
          properties:
            id: { type: string, format: uuid, description: Staff only. }
            fullName: { type: string }
            phone: { type: string }
        failureReason: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        deliveredAt: { type: string, format: date-time, nullable: true }
    ParcelListItem:
      type: object
      required:
        [
          id,
          trackingNumber,
          status,
          recipientName,
          dropoffCity,
          total,
          currency,
          createdAt,
        ]
      properties:
        id: { type: string, format: uuid }
        trackingNumber: { type: string }
        status: { $ref: '#/components/schemas/ParcelStatus' }
        recipientName: { type: string }
        dropoffCity: { type: string }
        total: { type: number }
        currency: { type: string, enum: [LKR] }
        createdAt: { type: string, format: date-time }
    ParcelListMeta:
      type: object
      required: [requestId, timestamp, pagination]
      properties:
        requestId: { type: string }
        timestamp: { type: string, format: date-time }
        pagination:
          type: object
          required: [page, pageSize, totalItems, totalPages]
          properties:
            page: { type: integer }
            pageSize: { type: integer }
            totalItems: { type: integer }
            totalPages: { type: integer }
    ParcelHistoryItem:
      type: object
      required:
        [previousStatus, status, note, failureReason, actorRole, changedAt]
      properties:
        previousStatus: { type: string, nullable: true }
        status: { $ref: '#/components/schemas/ParcelStatus' }
        note: { type: string, nullable: true }
        failureReason: { type: string, nullable: true }
        actorRole: { type: string, nullable: true }
        changedAt: { type: string, format: date-time }
    ParcelSummary:
      type: object
      additionalProperties: false
      required:
        [
          parcelId,
          trackingNumber,
          status,
          customerUserId,
          merchantId,
          externalOrderId,
          recipientName,
        ]
      properties:
        parcelId: { type: string, format: uuid }
        trackingNumber: { type: string }
        status: { $ref: '#/components/schemas/ParcelStatus' }
        customerUserId: { type: string, format: uuid, nullable: true }
        merchantId: { type: string, format: uuid, nullable: true }
        externalOrderId: { type: string, nullable: true }
        recipientName: { type: string }
    HealthResponse:
      type: object
      additionalProperties: false
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - ok
    ReadinessResponse:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - ready
            - unavailable
        checks:
          type: object
          additionalProperties:
            type: string
            enum:
              - ok
              - down
    ErrorResponse:
      type: object
      additionalProperties: false
      required:
        - error
        - meta
      properties:
        error:
          $ref: '#/components/schemas/ErrorDetail'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    ErrorDetail:
      type: object
      additionalProperties: false
      required:
        - code
        - message
      properties:
        code:
          type: string
          description: Stable machine-readable error code from API v1.1.
        message:
          type: string
          description: Human-readable message with no internal implementation details.
        details:
          type: array
          description: Field-level validation details, present only for validation errors.
          items:
            type: object
            additionalProperties: true
        currentFee:
          type: number
          minimum: 0
          description: Authoritative total in LKR, present for PRICE_CHANGED only.
    ResponseMeta:
      type: object
      additionalProperties: false
      required:
        - requestId
      properties:
        requestId:
          type: string
          description: Request correlation ID, also returned in the X-Request-Id header.
    SuccessMeta:
      type: object
      additionalProperties: false
      required:
        - requestId
        - timestamp
      properties:
        requestId: &a1
          type: string
        timestamp: &a2
          type: string
          format: date-time
    PublicTracking:
      type: object
      additionalProperties: false
      required:
        - trackingNumber
        - status
        - pickupCity
        - dropoffCity
        - lastUpdatedAt
        - timeline
      properties:
        trackingNumber:
          type: string
          pattern: ^SD[KN][A-Z0-9]{8}$
        status: &a3
          type: string
          enum:
            - CREATED
            - PICKED_UP
            - IN_TRANSIT
            - OUT_FOR_DELIVERY
            - DELIVERED
            - FAILED
        pickupCity: *a1
        dropoffCity: *a1
        lastUpdatedAt: *a2
        timeline:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
              - status
              - at
            properties:
              status: *a3
              at: *a2
    Pagination:
      type: object
      additionalProperties: false
      required:
        - page
        - pageSize
        - totalItems
        - totalPages
      properties:
        page:
          type: integer
        pageSize:
          type: integer
        totalItems:
          type: integer
        totalPages:
          type: integer
    ListMeta:
      type: object
      additionalProperties: false
      required:
        - requestId
        - timestamp
        - pagination
      properties:
        requestId:
          type: string
        timestamp:
          type: string
          format: date-time
        pagination:
          $ref: '#/components/schemas/Pagination'
    UnassignedParcel:
      type: object
      additionalProperties: false
      required:
        - id
        - trackingNumber
        - status
        - pickupAddress
        - pickupCity
        - dropoffAddress
        - dropoffCity
        - weightKg
        - sizeCategory
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        trackingNumber:
          type: string
          pattern: ^SD[KN][A-Z0-9]{8}$
        status:
          type: string
        pickupAddress:
          type: string
        pickupCity:
          type: string
        pickupZoneId:
          type: string
          format: uuid
        dropoffAddress:
          type: string
        dropoffCity:
          type: string
        dropoffZoneId:
          type: string
          format: uuid
        weightKg:
          type: number
        sizeCategory:
          type: string
        createdAt:
          type: string
          format: date-time
    AssignResult:
      type: object
      additionalProperties: false
      required:
        - parcelId
        - trackingNumber
        - courierId
        - assignedBy
        - assignedAt
      properties:
        parcelId:
          type: string
          format: uuid
        trackingNumber:
          type: string
          pattern: ^SD[KN][A-Z0-9]{8}$
        courierId:
          type: string
          format: uuid
        previousCourierId:
          type: string
          format: uuid
          nullable: true
        assignedBy:
          type: string
          format: uuid
        assignedAt:
          type: string
          format: date-time
    CourierWorkload:
      type: object
      additionalProperties: false
      required:
        - courierId
        - fullName
        - isAvailable
        - activeDeliveries
        - byStatus
      properties:
        courierId:
          type: string
          format: uuid
        fullName:
          type: string
        isAvailable:
          type: boolean
        activeDeliveries:
          type: integer
        byStatus:
          type: object
          additionalProperties:
            type: integer
    AdminParcelItem:
      type: object
      additionalProperties: false
      required:
        - id
        - trackingNumber
        - status
        - pickupCity
        - dropoffCity
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        trackingNumber:
          type: string
          pattern: ^SD[KN][A-Z0-9]{8}$
        status:
          type: string
        pickupCity:
          type: string
        dropoffCity:
          type: string
        courierId:
          type: string
          format: uuid
          nullable: true
        merchantId:
          type: string
          format: uuid
          nullable: true
        customerId:
          type: string
          format: uuid
          nullable: true
        total:
          type: number
        createdAt:
          type: string
          format: date-time
    CourierStatusUpdate:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          description: >-
            Target status for the generic route. PICKED_UP is no longer a
            target (use the pickup endpoint) and DELIVERED is no longer a target
            (use the delivery endpoint). Both are rejected with PROOF_REQUIRED.
          enum: [IN_TRANSIT, OUT_FOR_DELIVERY, FAILED]
        recipientName:
          type: string
          maxLength: 150
          description: >-
            Accepted for backward compatibility but ignored. Delivery uses the
            delivery endpoint, which requires the recipient name and a photo.
        failureReason:
          type: string
          minLength: 5
          maxLength: 255
          description: Required for FAILED; 5 to 255 characters after trimming.
        note:
          type: string
          maxLength: 500
    CourierStatusResult:
      type: object
      required: [parcelId, trackingNumber, previousStatus, status, updatedAt]
      properties:
        parcelId: { type: string, format: uuid }
        trackingNumber: { type: string }
        previousStatus:
          type: string
          enum:
            [
              CREATED,
              PICKED_UP,
              IN_TRANSIT,
              OUT_FOR_DELIVERY,
              DELIVERED,
              FAILED,
            ]
        status:
          type: string
          enum: [PICKED_UP, IN_TRANSIT, OUT_FOR_DELIVERY, DELIVERED, FAILED]
        updatedAt: { type: string, format: date-time }
    CourierPickupUpload:
      type: object
      additionalProperties: false
      required: [photo]
      properties:
        photo:
          type: string
          format: binary
          description: Required valid JPEG or PNG content, maximum exactly 5 MiB.
        note:
          type: string
          maxLength: 500
          description: Optional note stored on the PICKED_UP history row.
    CourierDeliveryConfirmation:
      type: object
      additionalProperties: false
      required: [photo, recipientName]
      properties:
        photo:
          type: string
          format: binary
          description: Required valid JPEG or PNG content, maximum exactly 5 MiB.
        recipientName:
          type: string
          minLength: 1
          maxLength: 150
          description: Required and non-blank after trimming.
        note:
          type: string
          maxLength: 500
          description: Optional delivery note.
    CourierWorkflowResult:
      type: object
      additionalProperties: false
      required:
        [
          parcelId,
          trackingNumber,
          previousStatus,
          status,
          updatedAt,
          alreadyApplied,
          history,
          proof,
        ]
      properties:
        parcelId: { type: string, format: uuid }
        trackingNumber: { type: string }
        previousStatus:
          type: string
          enum:
            [
              CREATED,
              PICKED_UP,
              IN_TRANSIT,
              OUT_FOR_DELIVERY,
              DELIVERED,
              FAILED,
            ]
        status:
          type: string
          enum:
            [
              CREATED,
              PICKED_UP,
              IN_TRANSIT,
              OUT_FOR_DELIVERY,
              DELIVERED,
              FAILED,
            ]
        updatedAt: { type: string, format: date-time }
        alreadyApplied:
          type: boolean
          description: True when a retry found the transition already committed; nothing was written.
        history:
          type: array
          description: The history rows created by this operation, oldest first.
          items: { $ref: '#/components/schemas/CourierHistory' }
        proof:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/CourierProof'
    CourierProof:
      type: object
      additionalProperties: false
      required: [id, kind, recipientName, note, hasPhoto, createdAt]
      properties:
        id: { type: string, format: uuid }
        kind:
          type: string
          enum: [PICKUP, DELIVERY]
        recipientName: { type: string, nullable: true }
        note: { type: string, nullable: true }
        hasPhoto: { type: boolean }
        createdAt: { type: string, format: date-time }
    ProofPhotoURL:
      type: object
      additionalProperties: false
      required: [url, expiresAt, mimeType, stream]
      properties:
        url: { type: string }
        expiresAt: { type: string, format: date-time }
        mimeType: { type: string, enum: [image/jpeg, image/png] }
        stream:
          type: boolean
          description: True when the URL points at the authorized Parcel content route.
    CourierProofUpload:
      type: object
      additionalProperties: false
      description: At least one property must be present.
      properties:
        photo:
          type: string
          format: binary
          description: Valid JPEG or PNG content, maximum exactly 5 MiB (5,242,880 bytes).
        recipientName:
          type: string
          maxLength: 150
        note:
          type: string
          maxLength: 500
      anyOf:
        - required: [photo]
        - required: [recipientName]
        - required: [note]
    CourierProofResult:
      type: object
      additionalProperties: false
      required: [id, parcelId, recipientName, note, hasPhoto, createdAt]
      properties:
        id: { type: string, format: uuid }
        parcelId: { type: string, format: uuid }
        recipientName: { type: string, nullable: true }
        note: { type: string, nullable: true }
        hasPhoto: { type: boolean }
        createdAt: { type: string, format: date-time }
    CourierDelivery:
      type: object
      required:
        [
          id,
          trackingNumber,
          status,
          pickupAddress,
          dropoffAddress,
          dropoffCity,
          recipientName,
          recipientPhone,
          weightKg,
          assignedAt,
        ]
      properties:
        id: { type: string, format: uuid }
        trackingNumber: { type: string }
        status:
          type: string
          enum:
            [
              CREATED,
              PICKED_UP,
              IN_TRANSIT,
              OUT_FOR_DELIVERY,
              DELIVERED,
              FAILED,
            ]
        pickupAddress: { type: string }
        dropoffAddress: { type: string }
        dropoffCity: { type: string }
        recipientName: { type: string }
        recipientPhone: { type: string }
        weightKg: { type: number }
        assignedAt: { type: string, format: date-time }
    CourierDeliveryDetail:
      allOf:
        - $ref: '#/components/schemas/CourierDelivery'
        - type: object
          required:
            [
              description,
              sizeCategory,
              senderName,
              senderPhone,
              history,
              proof,
              proofs,
            ]
          properties:
            description: { type: string, nullable: true }
            sizeCategory:
              { type: string, enum: [SMALL, MEDIUM, LARGE, OVERSIZED] }
            senderName: { type: string }
            senderPhone: { type: string }
            history:
              type: array
              items: { $ref: '#/components/schemas/CourierHistory' }
            proof:
              nullable: true
              description: The latest proof, kept for clients that need one photo.
              allOf:
                - $ref: '#/components/schemas/CourierProof'
            proofs:
              type: array
              description: Every proof for the parcel, oldest first.
              items: { $ref: '#/components/schemas/CourierProof' }
    CourierHistory:
      type: object
      additionalProperties: false
      required:
        [previousStatus, status, note, failureReason, actorRole, changedAt]
      properties:
        previousStatus: { type: string, nullable: true }
        status: { type: string }
        note: { type: string, nullable: true }
        failureReason: { type: string, nullable: true }
        actorRole: { type: string, nullable: true }
        changedAt: { type: string, format: date-time }
  responses:
    ParcelBadRequest:
      description:
        Malformed JSON, unknown fields, invalid decimal encoding, or a request exceeding the 1
        MiB limit (413).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    ParcelUnauthenticated:
      description: Missing or invalid access credentials or internal token.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    ParcelForbidden:
      description: The signed-in role cannot perform this operation.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    ParcelValidation:
      description:
        VALIDATION_ERROR, ROUTE_NOT_SERVICEABLE or WEIGHT_NOT_PRICED. Field validation uses
        error.details.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    ParcelUnavailable:
      description:
        SERVICE_UNAVAILABLE. Authentication, internal token, database or required downstream
        service is unavailable.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    NotFound:
      description: No route matched the request path. Returns the standard error envelope with code `NOT_FOUND`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: NOT_FOUND
              message: route not found
            meta:
              requestId: req_01
    MethodNotAllowed:
      description:
        The HTTP method is not allowed for the requested path. Returns the standard error
        envelope with code `METHOD_NOT_ALLOWED`; the `Allow` header lists the permitted methods.
      headers:
        Allow:
          description: Comma-separated list of methods allowed for the path.
          schema:
            type: string
          example: GET
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: METHOD_NOT_ALLOWED
              message: method not allowed
            meta:
              requestId: req_01
    InternalServerError:
      description:
        An unexpected server error occurred. Returns the standard error envelope with code
        `INTERNAL_ERROR`; internal details are not exposed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: INTERNAL_ERROR
              message: internal server error
            meta:
              requestId: req_01
    CourierUnauthenticated:
      description: UNAUTHENTICATED or TOKEN_EXPIRED. Missing, invalid or expired access token.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    CourierForbidden:
      description: FORBIDDEN. Role is not COURIER, or parcel is not currently assigned to this courier.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    CourierUnavailable:
      description: SERVICE_UNAVAILABLE. Authentication or database is not configured.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
  securitySchemes:
    InternalToken:
      type: apiKey
      in: header
      name: X-Internal-Token
    AccessCookie:
      type: apiKey
      in: cookie
      name: sd_access
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: HS256 JWT
