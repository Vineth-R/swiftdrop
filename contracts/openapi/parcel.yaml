openapi: 3.0.3
info:
  title: SwiftDrop Parcel API
  version: 1.1.0
  description: Implemented anonymous public tracking plus operational probes.
    Parcel creation, courier and dispatch business endpoints remain planned.
    Public tracking exposes only status, cities and timeline timestamps.
servers:
  - url: /api/v1
paths:
  /health:
    get:
      operationId: parcelHealth
      summary: Process health
      responses:
        '200':
          description: The service process is healthy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                status: ok
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalServerError'
      servers:
        - url: http://parcel:8082
      tags:
        - Internal operations
      x-internal: true
  /ready:
    get:
      operationId: parcelReady
      summary: Service readiness
      responses:
        '200':
          description: The service is ready. The database check is reported when
            DATABASE_URL is configured.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'
              example:
                status: ready
                checks:
                  database: ok
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          description: A dependency check is down.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'
              example:
                status: unavailable
                checks:
                  database: down
      servers:
        - url: http://parcel:8082
      tags:
        - Internal operations
      x-internal: true
  '/tracking/{trackingNumber}':
    get:
      operationId: publicTrackingLookup
      tags:
        - Public tracking
      security: []
      description: Anonymous lookup of actual persisted parcel state and ordered
        history. Limited to 30 requests per rolling minute per client IP. No
        names, addresses, phones, notes, failure details or proof data are
        returned.
      parameters:
        - name: trackingNumber
          in: path
          required: true
          schema:
            type: string
            pattern: ^SD[KN][A-Z0-9]{8}$
      responses:
        '200':
          description: Public parcel snapshot.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - data
                  - meta
                properties:
                  data:
                    $ref: '#/components/schemas/PublicTracking'
                  meta:
                    $ref: '#/components/schemas/SuccessMeta'
        '404':
          description: TRACKING_NOT_FOUND
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: 'VALIDATION_ERROR: malformed tracking number.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: RATE_LIMITED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers:
            Retry-After:
              schema:
                type: integer
                minimum: 1
            X-RateLimit-Remaining:
              schema:
                type: integer
                enum:
                  - 0
        '500':
          description: INTERNAL_ERROR
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: SERVICE_UNAVAILABLE
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  schemas:
    HealthResponse:
      type: object
      additionalProperties: false
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - ok
    ReadinessResponse:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - ready
            - unavailable
        checks:
          type: object
          additionalProperties:
            type: string
            enum:
              - ok
              - down
    ErrorResponse:
      type: object
      additionalProperties: false
      required:
        - error
        - meta
      properties:
        error:
          $ref: '#/components/schemas/ErrorDetail'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    ErrorDetail:
      type: object
      additionalProperties: false
      required:
        - code
        - message
      properties:
        code:
          type: string
          description: Stable machine-readable error code from API v1.1.
        message:
          type: string
          description: Human-readable message with no internal implementation details.
        details:
          type: array
          description: Field-level validation details, present only for validation errors.
          items:
            type: object
            additionalProperties: true
    ResponseMeta:
      type: object
      additionalProperties: false
      required:
        - requestId
      properties:
        requestId:
          type: string
          description: Request correlation ID, also returned in the X-Request-Id header.
    SuccessMeta:
      type: object
      additionalProperties: false
      required:
        - requestId
        - timestamp
      properties:
        requestId: &a1
          type: string
        timestamp: &a2
          type: string
          format: date-time
    PublicTracking:
      type: object
      additionalProperties: false
      required:
        - trackingNumber
        - status
        - pickupCity
        - dropoffCity
        - lastUpdatedAt
        - timeline
      properties:
        trackingNumber:
          type: string
          pattern: ^SD[KN][A-Z0-9]{8}$
        status: &a3
          type: string
          enum:
            - CREATED
            - PICKED_UP
            - IN_TRANSIT
            - OUT_FOR_DELIVERY
            - DELIVERED
            - FAILED
        pickupCity: *a1
        dropoffCity: *a1
        lastUpdatedAt: *a2
        timeline:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
              - status
              - at
            properties:
              status: *a3
              at: *a2
  responses:
    NotFound:
      description: No route matched the request path. Returns the standard error
        envelope with code `NOT_FOUND`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: NOT_FOUND
              message: route not found
            meta:
              requestId: req_01
    MethodNotAllowed:
      description:
        The HTTP method is not allowed for the requested path. Returns the
        standard error envelope with code `METHOD_NOT_ALLOWED`; the `Allow`
        header lists the permitted methods.
      headers:
        Allow:
          description: Comma-separated list of methods allowed for the path.
          schema:
            type: string
          example: GET
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: METHOD_NOT_ALLOWED
              message: method not allowed
            meta:
              requestId: req_01
    InternalServerError:
      description:
        An unexpected server error occurred. Returns the standard error
        envelope with code `INTERNAL_ERROR`; internal details are not exposed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: INTERNAL_ERROR
              message: internal server error
            meta:
              requestId: req_01
