openapi: 3.0.3
info:
  title: SwiftDrop Parcel API
  version: 1.1.0
  description: Implemented anonymous public tracking, DISPATCHER/ADMIN delivery
    reports, dispatch planning, courier assignment, workload balancing, and admin parcel search. Public tracking exposes only status,
    cities and timeline timestamps.
servers:
  - url: /api/v1
paths:
  /health:
    get:
      operationId: parcelHealth
      summary: Process health
      responses:
        '200':
          description: The service process is healthy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                status: ok
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalServerError'
      servers:
        - url: http://parcel:8082
      tags:
        - Internal operations
      x-internal: true
  /ready:
    get:
      operationId: parcelReady
      summary: Service readiness
      responses:
        '200':
          description: The service is ready. The database check is reported when
            DATABASE_URL is configured.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'
              example:
                status: ready
                checks:
                  database: ok
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          description: A dependency check is down.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'
              example:
                status: unavailable
                checks:
                  database: down
      servers:
        - url: http://parcel:8082
      tags:
        - Internal operations
      x-internal: true
  '/tracking/{trackingNumber}':
    get:
      operationId: publicTrackingLookup
      tags:
        - Public tracking
      security: []
      description: Anonymous lookup of actual persisted parcel state and ordered
        history. Limited to 30 requests per rolling minute per client IP. No
        names, addresses, phones, notes, failure details or proof data are
        returned.
      parameters:
        - name: trackingNumber
          in: path
          required: true
          schema:
            type: string
            pattern: ^SD[KN][A-Z0-9]{8}$
      responses:
        '200':
          description: Public parcel snapshot.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - data
                  - meta
                properties:
                  data:
                    $ref: '#/components/schemas/PublicTracking'
                  meta:
                    $ref: '#/components/schemas/SuccessMeta'
        '404':
          description: TRACKING_NOT_FOUND
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: 'VALIDATION_ERROR: malformed tracking number.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: RATE_LIMITED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers:
            Retry-After:
              schema:
                type: integer
                minimum: 1
            X-RateLimit-Remaining:
              schema:
                type: integer
                enum:
                  - 0
        '500':
          description: INTERNAL_ERROR
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: SERVICE_UNAVAILABLE
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /reports/daily:
    get:
      operationId: dailyReport
      summary: Daily created, delivered and failed counts
      description: DISPATCHER and ADMIN. Counts by event date in UTC. `created`
        uses the parcel creation date, `delivered` the delivery date and
        `failed` the failure date, so one parcel can appear on more than one
        day. `from` and `to` are inclusive UTC dates. The default is the last
        7 calendar dates (7 dates ending today UTC); the range may not exceed
        90 days. Every date in the range is returned, including dates with no
        parcels.
      tags:
        - Reports
      security:
        - AccessCookie: []
        - BearerAuth: []
      parameters:
        - name: from
          in: query
          schema:
            type: string
            format: date
        - name: to
          in: query
          schema:
            type: string
            format: date
      responses:
        '200':
          description: One row per day in the range.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required:
                        - date
                        - created
                        - delivered
                        - failed
                      properties:
                        date:
                          type: string
                          format: date
                        created:
                          type: integer
                        delivered:
                          type: integer
                        failed:
                          type: integer
                  meta:
                    $ref: '#/components/schemas/SuccessMeta'
        '401':
          description: UNAUTHENTICATED or TOKEN_EXPIRED.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: FORBIDDEN. Only DISPATCHER and ADMIN may read reports.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: VALIDATION_ERROR. Bad date, from after to, or range over 90 days.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: INTERNAL_ERROR
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: SERVICE_UNAVAILABLE. Authentication is not configured or the database is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /reports/outcomes:
    get:
      operationId: outcomesReport
      summary: Success and failure rates with top failure reasons
      description: DISPATCHER and ADMIN. Follows parcels whose creation date is
        in the inclusive UTC range and reports their current status, so
        `created = delivered + failed + inProgress`. Rates are percentages of
        finished parcels (delivered plus failed), rounded to two decimals. The
        default is the last 30 calendar dates (30 dates ending today UTC);
        `topFailureReasons` is limited to five entries; the range may not
        exceed 90 days.
      tags:
        - Reports
      security:
        - AccessCookie: []
        - BearerAuth: []
      parameters:
        - name: from
          in: query
          schema:
            type: string
            format: date
        - name: to
          in: query
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Outcome summary for the range.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    type: object
                    required:
                      - from
                      - to
                      - totals
                      - successRate
                      - failureRate
                      - topFailureReasons
                    properties:
                      from:
                        type: string
                        format: date
                      to:
                        type: string
                        format: date
                      totals:
                        type: object
                        required:
                          - created
                          - delivered
                          - failed
                          - inProgress
                        properties:
                          created:
                            type: integer
                          delivered:
                            type: integer
                          failed:
                            type: integer
                          inProgress:
                            type: integer
                      successRate:
                        type: number
                      failureRate:
                        type: number
                      topFailureReasons:
                        type: array
                        items:
                          type: object
                          required:
                            - reason
                            - count
                          properties:
                            reason:
                              type: string
                            count:
                              type: integer
                  meta:
                    $ref: '#/components/schemas/SuccessMeta'
        '401':
          description: UNAUTHENTICATED or TOKEN_EXPIRED.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: FORBIDDEN. Only DISPATCHER and ADMIN may read reports.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: VALIDATION_ERROR. Bad date, from after to, or range over 90 days.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: INTERNAL_ERROR
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: SERVICE_UNAVAILABLE. Authentication is not configured or the database is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /dispatch/unassigned:
    get:
      operationId: listUnassignedParcels
      summary: List unassigned parcels for dispatch planning
      description: DISPATCHER and ADMIN. Lists parcels that have no current courier and are not in a terminal state (DELIVERED or FAILED).
      tags:
        - Dispatch
      security:
        - AccessCookie: []
        - BearerAuth: []
      parameters:
        - name: zoneId
          in: query
          description: Filter by pickup zone ID.
          schema:
            type: string
            format: uuid
        - name: from
          in: query
          description: Inclusive creation start timestamp.
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          description: Inclusive creation end timestamp.
          schema:
            type: string
            format: date-time
        - name: page
          in: query
          description: Page number, 1-based.
          schema:
            type: integer
            default: 1
            minimum: 1
        - name: pageSize
          in: query
          description: Page size, maximum 100.
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
        - name: sort
          in: query
          description: Sorting field and direction (default createdAt:asc).
          schema:
            type: string
            default: createdAt:asc
      responses:
        '200':
          description: Paginated list of unassigned parcels.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/UnassignedParcel'
                  meta:
                    $ref: '#/components/schemas/ListMeta'
        '401':
          description: UNAUTHENTICATED or TOKEN_EXPIRED.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: FORBIDDEN. Only DISPATCHER and ADMIN may access dispatch planning.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: VALIDATION_ERROR. Malformed query parameters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          description: SERVICE_UNAVAILABLE. Database or authentication is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  '/dispatch/parcels/{parcelId}/assignment':
    put:
      operationId: assignParcelCourier
      summary: Assign or reassign a parcel to a courier
      description: DISPATCHER and ADMIN. Assigns a parcel to an eligible courier, atomically updates current assignments, and queues a parcel.assigned.v1 event.
      tags:
        - Dispatch
      security:
        - AccessCookie: []
        - BearerAuth: []
      parameters:
        - name: parcelId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - courierId
              properties:
                courierId:
                  type: string
                  format: uuid
                reason:
                  type: string
                  description: Optional rationale for assignment; recommended for reassignments.
      responses:
        '200':
          description: Assignment completed successfully.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    $ref: '#/components/schemas/AssignResult'
                  meta:
                    $ref: '#/components/schemas/SuccessMeta'
        '400':
          description: BAD_REQUEST. Invalid JSON body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: UNAUTHENTICATED or TOKEN_EXPIRED.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: FORBIDDEN. Only DISPATCHER and ADMIN may assign couriers.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: PARCEL_NOT_FOUND. Parcel does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: PARCEL_CLOSED. Terminal parcels (DELIVERED or FAILED) cannot be assigned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: PAYLOAD_TOO_LARGE. Request body exceeds 16 KiB limit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: COURIER_NOT_ELIGIBLE or VALIDATION_ERROR.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          description: SERVICE_UNAVAILABLE. Identity eligibility lookup or database is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /dispatch/workload:
    get:
      operationId: getCourierWorkload
      summary: View courier active delivery workload and availability
      description: DISPATCHER and ADMIN. Lists active couriers with counts of parcels assigned to them by status.
      tags:
        - Dispatch
      security:
        - AccessCookie: []
        - BearerAuth: []
      responses:
        '200':
          description: Active couriers workload summary.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/CourierWorkload'
                  meta:
                    $ref: '#/components/schemas/SuccessMeta'
        '401':
          description: UNAUTHENTICATED or TOKEN_EXPIRED.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: FORBIDDEN. Only DISPATCHER and ADMIN may read workload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          description: SERVICE_UNAVAILABLE. Identity or database is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /admin/parcels:
    get:
      operationId: listAdminParcels
      summary: Administrative search and monitor across all parcels
      description: DISPATCHER and ADMIN. Paginated search and filtering of parcels across the platform.
      tags:
        - Admin
      security:
        - AccessCookie: []
        - BearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
        - name: courierId
          in: query
          schema:
            type: string
            format: uuid
        - name: merchantId
          in: query
          schema:
            type: string
            format: uuid
        - name: customerId
          in: query
          schema:
            type: string
            format: uuid
        - name: trackingNumber
          in: query
          schema:
            type: string
        - name: from
          in: query
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          schema:
            type: string
            format: date-time
        - name: page
          in: query
          schema:
            type: integer
            default: 1
            minimum: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
        - name: sort
          in: query
          schema:
            type: string
            default: createdAt:desc
      responses:
        '200':
          description: Paginated administrative parcel listings.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AdminParcelItem'
                  meta:
                    $ref: '#/components/schemas/ListMeta'
        '401':
          description: UNAUTHENTICATED or TOKEN_EXPIRED.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: FORBIDDEN. Only DISPATCHER and ADMIN may access admin parcels.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: VALIDATION_ERROR. Invalid filter parameter values.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          description: SERVICE_UNAVAILABLE. Database is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  schemas:
    HealthResponse:
      type: object
      additionalProperties: false
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - ok
    ReadinessResponse:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - ready
            - unavailable
        checks:
          type: object
          additionalProperties:
            type: string
            enum:
              - ok
              - down
    ErrorResponse:
      type: object
      additionalProperties: false
      required:
        - error
        - meta
      properties:
        error:
          $ref: '#/components/schemas/ErrorDetail'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    ErrorDetail:
      type: object
      additionalProperties: false
      required:
        - code
        - message
      properties:
        code:
          type: string
          description: Stable machine-readable error code from API v1.1.
        message:
          type: string
          description: Human-readable message with no internal implementation details.
        details:
          type: array
          description: Field-level validation details, present only for validation errors.
          items:
            type: object
            additionalProperties: true
    ResponseMeta:
      type: object
      additionalProperties: false
      required:
        - requestId
      properties:
        requestId:
          type: string
          description: Request correlation ID, also returned in the X-Request-Id header.
    SuccessMeta:
      type: object
      additionalProperties: false
      required:
        - requestId
        - timestamp
      properties:
        requestId: &a1
          type: string
        timestamp: &a2
          type: string
          format: date-time
    PublicTracking:
      type: object
      additionalProperties: false
      required:
        - trackingNumber
        - status
        - pickupCity
        - dropoffCity
        - lastUpdatedAt
        - timeline
      properties:
        trackingNumber:
          type: string
          pattern: ^SD[KN][A-Z0-9]{8}$
        status: &a3
          type: string
          enum:
            - CREATED
            - PICKED_UP
            - IN_TRANSIT
            - OUT_FOR_DELIVERY
            - DELIVERED
            - FAILED
        pickupCity: *a1
        dropoffCity: *a1
        lastUpdatedAt: *a2
        timeline:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
              - status
              - at
            properties:
              status: *a3
              at: *a2
    Pagination:
      type: object
      additionalProperties: false
      required:
        - page
        - pageSize
        - totalItems
        - totalPages
      properties:
        page:
          type: integer
        pageSize:
          type: integer
        totalItems:
          type: integer
        totalPages:
          type: integer
    ListMeta:
      type: object
      additionalProperties: false
      required:
        - requestId
        - timestamp
        - pagination
      properties:
        requestId:
          type: string
        timestamp:
          type: string
          format: date-time
        pagination:
          $ref: '#/components/schemas/Pagination'
    UnassignedParcel:
      type: object
      additionalProperties: false
      required:
        - id
        - trackingNumber
        - status
        - pickupAddress
        - pickupCity
        - dropoffAddress
        - dropoffCity
        - weightKg
        - sizeCategory
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        trackingNumber:
          type: string
          pattern: ^SD[KN][A-Z0-9]{8}$
        status:
          type: string
        pickupAddress:
          type: string
        pickupCity:
          type: string
        pickupZoneId:
          type: string
          format: uuid
        dropoffAddress:
          type: string
        dropoffCity:
          type: string
        dropoffZoneId:
          type: string
          format: uuid
        weightKg:
          type: number
        sizeCategory:
          type: string
        createdAt:
          type: string
          format: date-time
    AssignResult:
      type: object
      additionalProperties: false
      required:
        - parcelId
        - trackingNumber
        - courierId
        - assignedBy
        - assignedAt
      properties:
        parcelId:
          type: string
          format: uuid
        trackingNumber:
          type: string
          pattern: ^SD[KN][A-Z0-9]{8}$
        courierId:
          type: string
          format: uuid
        previousCourierId:
          type: string
          format: uuid
          nullable: true
        assignedBy:
          type: string
          format: uuid
        assignedAt:
          type: string
          format: date-time
    CourierWorkload:
      type: object
      additionalProperties: false
      required:
        - courierId
        - fullName
        - isAvailable
        - activeDeliveries
        - byStatus
      properties:
        courierId:
          type: string
          format: uuid
        fullName:
          type: string
        isAvailable:
          type: boolean
        activeDeliveries:
          type: integer
        byStatus:
          type: object
          additionalProperties:
            type: integer
    AdminParcelItem:
      type: object
      additionalProperties: false
      required:
        - id
        - trackingNumber
        - status
        - pickupCity
        - dropoffCity
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        trackingNumber:
          type: string
          pattern: ^SD[KN][A-Z0-9]{8}$
        status:
          type: string
        pickupCity:
          type: string
        dropoffCity:
          type: string
        courierId:
          type: string
          format: uuid
          nullable: true
        merchantId:
          type: string
          format: uuid
          nullable: true
        customerId:
          type: string
          format: uuid
          nullable: true
        total:
          type: number
        createdAt:
          type: string
          format: date-time
  responses:
    NotFound:
      description: No route matched the request path. Returns the standard error
        envelope with code `NOT_FOUND`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: NOT_FOUND
              message: route not found
            meta:
              requestId: req_01
    MethodNotAllowed:
      description:
        The HTTP method is not allowed for the requested path. Returns the
        standard error envelope with code `METHOD_NOT_ALLOWED`; the `Allow`
        header lists the permitted methods.
      headers:
        Allow:
          description: Comma-separated list of methods allowed for the path.
          schema:
            type: string
          example: GET
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: METHOD_NOT_ALLOWED
              message: method not allowed
            meta:
              requestId: req_01
    InternalServerError:
      description:
        An unexpected server error occurred. Returns the standard error
        envelope with code `INTERNAL_ERROR`; internal details are not exposed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: INTERNAL_ERROR
              message: internal server error
            meta:
              requestId: req_01
  securitySchemes:
    AccessCookie:
      type: apiKey
      in: cookie
      name: sd_access
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: HS256 JWT
