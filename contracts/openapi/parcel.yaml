openapi: 3.0.3
info:
  title: SwiftDrop Parcel API
  version: 1.1.0
  description:
    Customer parcel creation, owned reads, PDF receipts, authenticated internal merchant
    creation and summaries, anonymous public tracking, DISPATCHER/ADMIN delivery reports,
    dispatch planning, courier assignment, workload balancing, admin parcel search,
    assignment-scoped courier delivery reads and courier status updates, and operational
    probes. Creation atomically stores parcel, initial history and PENDING outbox data;
    courier status updates lock the parcel, verify the current assignment and commit the
    parcel, history and PENDING outbox row in one transaction. The M6 relay publishes
    versioned domain events after commit. Private proof uploads and short-lived or
    authorized photo reads are implemented. Public tracking exposes only status, cities and
    timeline timestamps; authenticated tracking is ownership-scoped and returns the same
    allowlist, with DISPATCHER/ADMIN operational access.
servers:
  - url: /api/v1
paths:
  /health:
    get:
      operationId: parcelHealth
      summary: Process health
      responses:
        '200':
          description: The service process is healthy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                status: ok
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalServerError'
      servers:
        - url: http://parcel:8082
      tags:
        - Internal operations
      x-internal: true
  /ready:
    get:
      operationId: parcelReady
      summary: Service readiness
      responses:
        '200':
          description: The service is ready. The database check is reported when DATABASE_URL is configured.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'
              example:
                status: ready
                checks:
                  database: ok
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          description: A dependency check is down.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'
              example:
                status: unavailable
                checks:
                  database: down
      servers:
        - url: http://parcel:8082
      tags:
        - Internal operations
      x-internal: true
  '/tracking/{trackingNumber}':
    get:
      operationId: publicTrackingLookup
      tags:
        - Public tracking
      security: []
      description:
        Anonymous lookup of actual persisted parcel state and ordered history. Limited to 30
        requests per rolling minute per client IP. No names, addresses, phones, notes, failure
        details or proof data are returned.
      parameters:
        - name: trackingNumber
          in: path
          required: true
          schema:
            type: string
            pattern: ^SD[KN][A-Z0-9]{8}$
      responses:
        '200':
          description: Public parcel snapshot.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - data
                  - meta
                properties:
                  data:
                    $ref: '#/components/schemas/PublicTracking'
                  meta:
                    $ref: '#/components/schemas/SuccessMeta'
        '404':
          description: TRACKING_NOT_FOUND
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: 'VALIDATION_ERROR: malformed tracking number.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: RATE_LIMITED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers:
            Retry-After:
              schema:
                type: integer
                minimum: 1
            X-RateLimit-Remaining:
              schema:
                type: integer
                enum:
                  - 0
        '500':
          description: INTERNAL_ERROR
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: SERVICE_UNAVAILABLE
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /reports/daily:
    get:
      operationId: dailyReport
      summary: Daily created, delivered and failed counts
      description:
        DISPATCHER and ADMIN. Counts by event date in UTC. `created` uses the parcel creation
        date, `delivered` the delivery date and `failed` the failure date, so one parcel can appear
        on more than one day. `from` and `to` are inclusive UTC dates. The default is the last 7
        calendar dates (7 dates ending today UTC); the range may not exceed 90 days. Every date in
        the range is returned, including dates with no parcels.
      tags:
        - Reports
      security:
        - AccessCookie: []
        - BearerAuth: []
      parameters:
        - name: from
          in: query
          schema:
            type: string
            format: date
        - name: to
          in: query
          schema:
            type: string
            format: date
      responses:
        '200':
          description: One row per day in the range.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required:
                        - date
                        - created
                        - delivered
                        - failed
                      properties:
                        date:
                          type: string
                          format: date
                        created:
                          type: integer
                        delivered:
                          type: integer
                        failed:
                          type: integer
                  meta:
                    $ref: '#/components/schemas/SuccessMeta'
        '401':
          description: UNAUTHENTICATED or TOKEN_EXPIRED.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: FORBIDDEN. Only DISPATCHER and ADMIN may read reports.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: VALIDATION_ERROR. Bad date, from after to, or range over 90 days.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: INTERNAL_ERROR
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: SERVICE_UNAVAILABLE. Authentication is not configured or the database is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /reports/outcomes:
    get:
      operationId: outcomesReport
      summary: Success and failure rates with top failure reasons
      description:
        DISPATCHER and ADMIN. Follows parcels whose creation date is in the inclusive UTC range
        and reports their current status, so `created = delivered + failed + inProgress`. Rates are
        percentages of finished parcels (delivered plus failed), rounded to two decimals. The
        default is the last 30 calendar dates (30 dates ending today UTC); `topFailureReasons` is
        limited to five entries; the range may not exceed 90 days.
      tags:
        - Reports
      security:
        - AccessCookie: []
        - BearerAuth: []
      parameters:
        - name: from
          in: query
          schema:
            type: string
            format: date
        - name: to
          in: query
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Outcome summary for the range.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    type: object
                    required:
                      - from
                      - to
                      - totals
                      - successRate
                      - failureRate
                      - topFailureReasons
                    properties:
                      from:
                        type: string
                        format: date
                      to:
                        type: string
                        format: date
                      totals:
                        type: object
                        required:
                          - created
                          - delivered
                          - failed
                          - inProgress
                        properties:
                          created:
                            type: integer
                          delivered:
                            type: integer
                          failed:
                            type: integer
                          inProgress:
                            type: integer
                      successRate:
                        type: number
                      failureRate:
                        type: number
                      topFailureReasons:
                        type: array
                        items:
                          type: object
                          required:
                            - reason
                            - count
                          properties:
                            reason:
                              type: string
                            count:
                              type: integer
                  meta:
                    $ref: '#/components/schemas/SuccessMeta'
        '401':
          description: UNAUTHENTICATED or TOKEN_EXPIRED.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: FORBIDDEN. Only DISPATCHER and ADMIN may read reports.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: VALIDATION_ERROR. Bad date, from after to, or range over 90 days.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: INTERNAL_ERROR
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: SERVICE_UNAVAILABLE. Authentication is not configured or the database is unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /parcels:
    post:
      operationId: createCustomerParcel
      summary: Create a customer delivery
      tags: [Customer parcels]
      security:
        - AccessCookie: []
        - BearerAuth: []
      description: >-
        CUSTOMER only. Owner comes from the access token. The real internal pricing quote is
        compared with expectedFee before writing. The stored fee is immutable with respect to later
        pricing changes. Parcel, initial CREATED history and parcel.created outbox data commit
        together. A UUID key is scoped to the customer; identical retries (including concurrent
        inserts) return the existing parcel with 201. Reusing a key for different delivery fields
        returns IDEMPOTENCY_CONFLICT. expectedFee is consent metadata and excluded from replay
        comparison. An existing replay does not need pricing to be available.
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CustomerParcelInput' }
      responses:
        '201':
          description: Created parcel or successful idempotent replay.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: '#/components/schemas/CreatedParcel' }
                  meta: { $ref: '#/components/schemas/SuccessMeta' }
        '400': { $ref: '#/components/responses/ParcelBadRequest' }
        '401': { $ref: '#/components/responses/ParcelUnauthenticated' }
        '403': { $ref: '#/components/responses/ParcelForbidden' }
        '409':
          description: PRICE_CHANGED with error.currentFee in LKR, or IDEMPOTENCY_CONFLICT.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example:
                error:
                  {
                    code: PRICE_CHANGED,
                    message: Confirm the current delivery fee.,
                    currentFee: 600,
                  }
                meta: { requestId: req_price }
        '413': { $ref: '#/components/responses/ParcelBadRequest' }
        '422': { $ref: '#/components/responses/ParcelValidation' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ParcelUnavailable' }
    get:
      operationId: listCustomerParcels
      summary: List the signed-in customer's parcels
      tags: [Customer parcels]
      security:
        - AccessCookie: []
        - BearerAuth: []
      description: CUSTOMER only. Ownership is applied in SQL. Date boundaries are inclusive UTC calendar dates.
      parameters:
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/ParcelStatus' }
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, maximum: 100000, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: sort
          in: query
          schema:
            {
              type: string,
              enum: ['createdAt:asc', 'createdAt:desc'],
              default: 'createdAt:desc',
            }
      responses:
        '200':
          description: Owned parcels, with deterministic createdAt/id ordering.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/ParcelListItem' }
                  meta: { $ref: '#/components/schemas/ParcelListMeta' }
        '401': { $ref: '#/components/responses/ParcelUnauthenticated' }
        '403': { $ref: '#/components/responses/ParcelForbidden' }
        '422': { $ref: '#/components/responses/ParcelValidation' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ParcelUnavailable' }
  '/parcels/tracking/{trackingNumber}':
    get:
      operationId: getAuthorizedTracking
      summary: Read tracking for an owned or operationally authorized parcel
      tags: [Customer parcels]
      security:
        - AccessCookie: []
        - BearerAuth: []
      description:
        CUSTOMER owner, DISPATCHER or ADMIN. The lookup is ownership-scoped in the same query
        (customer_user_id) and staff may read operationally. Another customer's tracking number
        returns the same 404 as a nonexistent one, so tracking numbers cannot be enumerated.
        Returns the same public allowlist as anonymous tracking; no names, addresses, phones,
        notes, failure details or proof data are returned. The AI assistant uses this endpoint
        and never the anonymous projection.
      parameters:
        - name: trackingNumber
          in: path
          required: true
          schema:
            type: string
            pattern: ^SD[KN][A-Z0-9]{8}$
      responses:
        '200':
          description: Authorized parcel snapshot.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, meta]
                properties:
                  data:
                    $ref: '#/components/schemas/PublicTracking'
                  meta:
                    $ref: '#/components/schemas/SuccessMeta'
        '401': { $ref: '#/components/responses/ParcelUnauthenticated' }
        '403': { $ref: '#/components/responses/ParcelForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ParcelValidation' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ParcelUnavailable' }
  '/parcels/{parcelId}':
    parameters:
      - $ref: '#/components/parameters/ParcelID'
    get:
      operationId: getParcelDetail
      summary: Read a parcel
      tags: [Customer parcels]
      security:
        - AccessCookie: []
        - BearerAuth: []
      description:
        CUSTOMER owner, DISPATCHER or ADMIN. Another customer's parcel returns the same 404 as
        a missing parcel. Assigned courier contact is resolved through Identity; only staff receive
        courier.id. If the assigned courier user no longer exists, the parcel is still returned with
        courier null. A genuine Identity outage returns SERVICE_UNAVAILABLE.
      responses:
        '200':
          description: Authorized parcel detail with the stored fee.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: '#/components/schemas/ParcelDetail' }
                  meta: { $ref: '#/components/schemas/SuccessMeta' }
        '401': { $ref: '#/components/responses/ParcelUnauthenticated' }
        '403': { $ref: '#/components/responses/ParcelForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ParcelValidation' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ParcelUnavailable' }
  '/parcels/{parcelId}/history':
    parameters:
      - $ref: '#/components/parameters/ParcelID'
    get:
      operationId: getParcelHistory
      summary: Read chronological append-only history
      tags: [Customer parcels]
      security:
        - AccessCookie: []
        - BearerAuth: []
      description: CUSTOMER owner, DISPATCHER or ADMIN. Ordered oldest first by created_at then id.
      responses:
        '200':
          description: Status history, oldest first.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/ParcelHistoryItem' }
                  meta: { $ref: '#/components/schemas/SuccessMeta' }
        '401': { $ref: '#/components/responses/ParcelUnauthenticated' }
        '403': { $ref: '#/components/responses/ParcelForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ParcelValidation' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ParcelUnavailable' }
  '/parcels/{parcelId}/assignments':
    parameters:
      - $ref: '#/components/parameters/ParcelID'
    get:
      operationId: getParcelAssignments
      summary: Read courier assignment history
      tags: [Customer parcels]
      security:
        - AccessCookie: []
        - BearerAuth: []
      description: >-
        DISPATCHER or ADMIN. Returns the parcel's courier assignments oldest
        first. A reassignment closes the previous row and inserts a new current
        row, so the list is an append-only history. IDs are Identity user IDs.
      responses:
        '200':
          description: Assignment history, oldest first.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required:
                        [id, courierId, assignedBy, assignedAt, isCurrent]
                      properties:
                        id: { type: string, format: uuid }
                        courierId: { type: string, format: uuid }
                        previousCourierId:
                          { type: string, format: uuid, nullable: true }
                        assignedBy: { type: string, format: uuid }
                        assignedAt: { type: string, format: date-time }
                        unassignedAt:
                          { type: string, format: date-time, nullable: true }
                        isCurrent: { type: boolean }
                        reason: { type: string, nullable: true }
                  meta: { $ref: '#/components/schemas/SuccessMeta' }
        '401': { $ref: '#/components/responses/ParcelUnauthenticated' }
        '403': { $ref: '#/components/responses/ParcelForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ParcelValidation' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ParcelUnavailable' }
  '/parcels/{parcelId}/receipt':
    parameters:
      - name: parcelId
        in: path
        required: true
        description: Parcel UUID or the public SDK/SDN tracking number.
        schema: { type: string }
    get:
      operationId: downloadParcelReceipt
      summary: Download a branded PDF receipt using the original stored price
      tags: [Customer parcels]
      security:
        - AccessCookie: []
        - BearerAuth: []
      description:
        CUSTOMER owner or ADMIN. The path value may be the parcel UUID or its public tracking
        number; ownership is checked by the same query. The receipt contains tracking number,
        sender/recipient names and addresses, description, weight, size, the stored fee
        components, current status, status timeline, dates and the configured support address.
        No repricing or payment claim occurs.
      responses:
        '200':
          description: PDF receipt. Authenticated parcel responses use Cache-Control no-store.
          headers:
            Content-Disposition:
              schema: { type: string }
              example: attachment; filename="receipt_SDK7M2Q9XP4.pdf"
            Cache-Control:
              schema: { type: string, example: no-store }
          content:
            application/pdf:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/ParcelUnauthenticated' }
        '403': { $ref: '#/components/responses/ParcelForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ParcelValidation' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ParcelUnavailable' }
  '/parcels/{parcelId}/proof/photo':
    parameters:
      - $ref: '#/components/parameters/ParcelID'
    get:
      operationId: getParcelProofPhotoURL
      summary: Get a short-lived delivery proof photo URL
      tags: [Customer parcels, Courier]
      security:
        - AccessCookie: []
        - BearerAuth: []
      description: |
        CUSTOMER owner, currently assigned COURIER, DISPATCHER or ADMIN. Returns
        the latest proof that has a photo. S3-compatible providers return a
        short-lived presigned URL; local development returns `stream: true` and
        a relative content URL that re-checks the same authorization. No public
        or permanent URL is ever returned. Cache-Control no-store.
      responses:
        '200':
          description: Short-lived proof photo target.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: '#/components/schemas/ProofPhotoURL' }
                  meta: { $ref: '#/components/schemas/SuccessMeta' }
        '400': { $ref: '#/components/responses/ParcelValidation' }
        '401': { $ref: '#/components/responses/ParcelUnauthenticated' }
        '403': { $ref: '#/components/responses/ParcelForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ParcelUnavailable' }
  '/parcels/{parcelId}/proof/photo/content':
    parameters:
      - $ref: '#/components/parameters/ParcelID'
    get:
      operationId: streamParcelProofPhoto
      summary: Stream a delivery proof photo for local storage
      tags: [Customer parcels, Courier]
      security:
        - AccessCookie: []
        - BearerAuth: []
      description: |
        Same authorization as the URL endpoint. Used when the configured provider
        cannot presign (local filesystem). The bytes are read through the Parcel
        service and never served from a public path. Cache-Control no-store.
      responses:
        '200':
          description: Proof photo bytes.
          headers:
            Cache-Control:
              schema: { type: string }
              example: no-store
          content:
            image/jpeg:
              schema: { type: string, format: binary }
            image/png:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/ParcelUnauthenticated' }
        '403': { $ref: '#/components/responses/ParcelForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ParcelUnavailable' }
  '/parcels/{parcelId}/proofs/{proofId}/photo':
    parameters:
      - $ref: '#/components/parameters/ParcelID'
      - in: path
        name: proofId
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getParcelProofPhotoByProofURL
      summary: Get a short-lived URL for one specific delivery proof photo
      tags: [Customer parcels, Courier]
      security:
        - AccessCookie: []
        - BearerAuth: []
      description: |
        Same authorization as the latest-photo route. CUSTOMER owner, currently
        assigned COURIER, DISPATCHER or ADMIN. The proof must belong to the
        parcel and have a photo. S3-compatible providers return a short-lived
        presigned URL; local development returns `stream: true` and a relative
        content URL. Cache-Control no-store.
      responses:
        '200':
          description: Short-lived proof photo target.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { $ref: '#/components/schemas/ProofPhotoURL' }
                  meta: { $ref: '#/components/schemas/SuccessMeta' }
        '400': { $ref: '#/components/responses/ParcelValidation' }
        '401': { $ref: '#/components/responses/ParcelUnauthenticated' }
        '403': { $ref: '#/components/responses/ParcelForbidden' }
        '404':
          description: NOT_FOUND (parcel or authorization) or PROOF_NOT_FOUND.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ParcelUnavailable' }
  '/parcels/{parcelId}/proofs/{proofId}/photo/content':
    parameters:
      - $ref: '#/components/parameters/ParcelID'
      - in: path
        name: proofId
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: streamParcelProofPhotoByProof
      summary: Stream one specific delivery proof photo for local storage
      tags: [Customer parcels, Courier]
      security:
        - AccessCookie: []
        - BearerAuth: []
      description: |
        Same authorization and local-stream behavior as the latest-photo content
        route, for one specific proof. Cache-Control no-store.
      responses:
        '200':
          description: Proof photo bytes.
          headers:
            Cache-Control:
              schema: { type: string }
              example: no-store
          content:
            image/jpeg:
              schema: { type: string, format: binary }
            image/png:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/ParcelUnauthenticated' }
        '403': { $ref: '#/components/responses/ParcelForbidden' }
        '404':
          description: NOT_FOUND or PROOF_NOT_FOUND.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ParcelUnavailable' }
  /internal/parcels:
    servers: [{ url: 'http://parcel:8082' }]
    post:
      operationId: createMerchantParcel
      summary: Create a merchant-owned parcel
      tags: [Internal parcels]
      x-internal: true
      security: [{ InternalToken: [] }]
      description: >-
        Never routed by Nginx. Caller supplies the verified merchant owner's user ID as
        createdByUserId, required by DB v1.1. No synthetic customer identity is inferred from
        merchantId. External order uniqueness is merchant scoped; same-delivery replay returns the
        existing SDN parcel. Pricing is authoritative and uses the real internal quote API without
        customer expectedFee consent.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MerchantParcelInput' }
      responses:
        '201':
          description: Merchant parcel or idempotent external-order replay.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: object
                    required: [parcelId, trackingNumber, status, fee]
                    properties:
                      parcelId: { type: string, format: uuid }
                      trackingNumber:
                        { type: string, pattern: '^SDN[A-Z2-9]{8}$' }
                      status: { $ref: '#/components/schemas/ParcelStatus' }
                      fee: { $ref: '#/components/schemas/ParcelFee' }
                  meta: { $ref: '#/components/schemas/SuccessMeta' }
        '400': { $ref: '#/components/responses/ParcelBadRequest' }
        '401': { $ref: '#/components/responses/ParcelUnauthenticated' }
        '409':
          description: IDEMPOTENCY_CONFLICT for an external order reused with a different delivery.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '413': { $ref: '#/components/responses/ParcelBadRequest' }
        '422': { $ref: '#/components/responses/ParcelValidation' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '503': { $ref: '#/components/responses/ParcelUnavailable' }
  '/internal/parcels/{parcelId}/summary':
    servers: [{ url: 'http://parcel:8082' }]
    parameters:
      - $ref: '#/components/parameters/ParcelID'
