openapi: 3.0.3
info:
  title: SwiftDrop Merchant API
  version: 0.1.0
  description: >-
    Merchant account management, integration settings, and future API
    credentials. This specification currently covers only the operational
    health endpoints. Successful merchant responses use the API v1.1 success
    envelope
    `{ "data": ..., "meta": { "requestId": "...", "timestamp": "..." } }`.
    Errors use the standard error envelope
    `{ "error": { "code": "...", "message": "..." }, "meta": { "requestId": "..." } }`.
    Error codes are the uppercase API v1.1 values, for example
    `VALIDATION_ERROR`, `UNAUTHORIZED`, `FORBIDDEN`, `NOT_FOUND`,
    `MERCHANT_NOT_APPROVED`, `KEY_LIMIT_REACHED`, and
    `INVALID_MERCHANT_STATE`. Unmatched routes return `404 NOT_FOUND`,
    disallowed methods return `405 METHOD_NOT_ALLOWED` with an `Allow` header,
    and unexpected failures return `500 INTERNAL_ERROR`.
servers:
  - url: /api/v1/merchants
  - url: /api/v1/merchant
  - url: /api/v1/admin/merchants
paths:
  /health:
    get:
      operationId: merchantHealth
      summary: Process health
      responses:
        '200':
          description: The service process is healthy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                status: ok
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /ready:
    get:
      operationId: merchantReady
      summary: Service readiness
      responses:
        '200':
          description: The service is ready. The database check is reported when DATABASE_URL is configured.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'
              example:
                status: ready
                checks:
                  database: ok
        '503':
          description: A dependency check is down.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'
              example:
                status: unavailable
                checks:
                  database: down
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /merchants/me/webhook:
    get:
      summary: Get the webhook settings (8.12)
      description: Returns the URL, subscribed event types and active state. The signing secret is never returned.
      tags: [Merchant webhook]
      responses:
        "200":
          description: Current webhook settings.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      url: { type: string, format: uri, example: "https://shopzone.lk/hooks/swiftdrop" }
                      eventTypes: { type: array, items: { type: string, enum: [parcel.status_changed] } }
                      isActive: { type: boolean }
                      updatedAt: { type: string, format: date-time }
        "404":
          description: WEBHOOK_NOT_CONFIGURED. The merchant has not saved a webhook.
    put:
      summary: Create or replace the webhook settings (8.13)
      description: >
        Approved merchants only. The URL must be HTTPS and must not point to a private or loopback address.
        A new signing secret is generated on the first save, or when rotateSecret is true, and is returned once
        in signingSecret. It is stored encrypted and cannot be read again.
      tags: [Merchant webhook]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url: { type: string, format: uri, maxLength: 500, example: "https://shopzone.lk/hooks/swiftdrop" }
                eventTypes: { type: array, items: { type: string, enum: [parcel.status_changed] }, default: [parcel.status_changed] }
                isActive: { type: boolean, default: true }
                rotateSecret: { type: boolean, default: false }
      responses:
        "200":
          description: Saved. signingSecret appears only when newly generated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      url: { type: string }
                      eventTypes: { type: array, items: { type: string } }
                      isActive: { type: boolean }
                      updatedAt: { type: string, format: date-time }
                      signingSecret: { type: string, example: "whsec_3F9aQ1xK7LmP2vR8" }
        "403":
          description: MERCHANT_NOT_APPROVED.
        "422":
          description: VALIDATION_ERROR, or WEBHOOK_URL_NOT_ALLOWED when the URL is not HTTPS or points to a private address.
  /merchants/me/webhook/test:
    post:
      summary: Send a sample event (8.14)
      description: Sends a signed sample event to the configured URL. A failed delivery still returns 200 with delivered false; httpStatus is null on timeout or connection failure.
      tags: [Merchant webhook]
      responses:
        "200":
          description: Result of the test delivery.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      delivered: { type: boolean }
                      httpStatus: { type: integer, nullable: true }
                      durationMs: { type: integer }
        "404":
          description: WEBHOOK_NOT_CONFIGURED.
  /merchants/me/webhook/deliveries:
    get:
      summary: Delivery attempt log (8.15)
      description: Every delivery attempt, including retries and dead-letter status, newest first.
      tags: [Merchant webhook]
      parameters:
        - { name: success, in: query, schema: { type: boolean } }
        - { name: trackingNumber, in: query, schema: { type: string, maxLength: 20 } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        "200":
          description: One page of attempts.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        eventId: { type: string }
                        trackingNumber: { type: string }
                        attemptNumber: { type: integer, minimum: 1, maximum: 6 }
                        httpStatus: { type: integer, nullable: true }
                        success: { type: boolean }
                        nextRetryAt: { type: string, format: date-time, nullable: true }
                        deadLettered: { type: boolean }
                        createdAt: { type: string, format: date-time }
        "422":
          description: VALIDATION_ERROR (bad success, page or pageSize).


components:
  schemas:
    HealthResponse:
      type: object
      additionalProperties: false
      required:
        - status
      properties:
        status:
          type: string
          enum: [ok]
    ReadinessResponse:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum: [ready, unavailable]
        checks:
          type: object
          additionalProperties:
            type: string
            enum: [ok, down]
    ErrorResponse:
      type: object
      additionalProperties: false
      required:
        - error
        - meta
      properties:
        error:
          $ref: '#/components/schemas/ErrorDetail'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    ErrorDetail:
      type: object
      additionalProperties: false
      required:
        - code
        - message
      properties:
        code:
          type: string
          description: Stable machine-readable error code from API v1.1.
        message:
          type: string
          description: Human-readable message with no internal implementation details.
        details:
          type: array
          description: Field-level validation details, present only for validation errors.
          items:
            type: object
            additionalProperties: true
    ResponseMeta:
      type: object
      additionalProperties: false
      required:
        - requestId
      properties:
        requestId:
          type: string
          description: Request correlation ID, also returned in the X-Request-Id header.
  responses:
    NotFound:
      description: >-
        No route matched the request path. Returns the standard error envelope
        with code `NOT_FOUND`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: NOT_FOUND
              message: route not found
            meta:
              requestId: req_01
    MethodNotAllowed:
      description: >-
        The HTTP method is not allowed for the requested path. Returns the
        standard error envelope with code `METHOD_NOT_ALLOWED`; the `Allow`
        header lists the permitted methods.
      headers:
        Allow:
          description: Comma-separated list of methods allowed for the path.
          schema:
            type: string
          example: GET
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: METHOD_NOT_ALLOWED
              message: method not allowed
            meta:
              requestId: req_01
    InternalServerError:
      description: >-
        An unexpected server error occurred. Returns the standard error envelope
        with code `INTERNAL_ERROR`; internal details are not exposed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: INTERNAL_ERROR
              message: internal server error
            meta:
              requestId: req_01
