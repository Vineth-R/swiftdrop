openapi: 3.0.3
info:
  title: SwiftDrop Identity internal API
  version: 0.1.0
  description: >-
    Service-to-service endpoints of the Identity service (API v1.1 section 13).
    They are **not public**: Nginx never routes `/internal` and returns
    `404 NOT_FOUND` for it, so this specification is separate from
    `identity.yaml`. Callers on the Compose network use the base URL
    `http://identity:8081`.


    Every call needs the shared secret in `X-Internal-Token` (the
    `INTERNAL_TOKEN` environment variable, at least 16 characters) and a
    well-formed `X-Request-Id`. If Identity has no valid `INTERNAL_TOKEN` it
    refuses every call with 401 instead of allowing them. Responses use the
    standard success envelope and error envelope. See
    `docs/identity-internal-api.md` for set-up and client examples.
servers:
  - url: http://identity:8081
    description: Compose network only
paths:
  /internal/couriers/{courierId}/eligibility:
    get:
      operationId: identityInternalCourierEligibility
      summary: Courier eligibility (API v1.1 section 13, called by Parcel)
      description: >-
        Returns the facts the Parcel service needs before assigning a parcel. Any
        existing user is answered with their real role. A courier may be assigned
        only when `role` is `COURIER` and `isActive` and `isAvailable` are both
        true; Identity does not decide that. A user without a courier profile has
        `isAvailable` false.
      parameters:
        - $ref: '#/components/parameters/InternalToken'
        - $ref: '#/components/parameters/RequestId'
        - name: courierId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The courier facts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EligibilityEnvelope'
              example:
                data: { isActive: true, isAvailable: true, role: COURIER }
                meta:
                  {
                    requestId: req_01HF-example,
                    timestamp: '2026-11-04T09:30:00Z',
                  }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /internal/users/{userId}/contact:
    get:
      operationId: identityInternalUserContact
      summary: User contact details (API v1.1 section 13, called by the notification worker)
      description: >-
        Returns the name, email and phone of any user, including a deactivated
        one. `phone` is an empty string when the user has none. This is personal
        data and must not be logged by the caller.
      parameters:
        - $ref: '#/components/parameters/InternalToken'
        - $ref: '#/components/parameters/RequestId'
        - name: userId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The contact details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactEnvelope'
              example:
                data:
                  {
                    fullName: Nimal Perera,
                    email: nimal@example.com,
                    phone: '+94771234567',
                  }
                meta:
                  {
                    requestId: req_01HF-example,
                    timestamp: '2026-11-04T09:30:00Z',
                  }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /internal/users/{userId}/session-state:
    get:
      operationId: identityInternalSessionState
      summary: Current session authority state
      description: >-
        Returns the user's role, active flag and session version. Merchant
        business requests compare the JWT `sv` claim with `sessionVersion`.
      parameters:
        - $ref: '#/components/parameters/InternalToken'
        - $ref: '#/components/parameters/RequestId'
        - name: userId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The current state.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      role: { type: string }
                      isActive: { type: boolean }
                      sessionVersion: { type: integer }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
  /internal/merchant-owners:
    post:
      operationId: identityInternalCreateMerchantOwner
      summary: Create or resume an inactive merchant owner
      description: >-
        Creates a LOCAL MERCHANT user with isActive=false. A retry with the same
        email and password returns the existing merchant user. The response is
        201 when created and 200 when resumed.
      parameters:
        - $ref: '#/components/parameters/InternalToken'
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, password, fullName, phone]
              properties:
                email: { type: string, format: email }
                password: { type: string }
                fullName: { type: string }
                phone: { type: string }
      responses:
        '200': { description: Existing merchant account resumed. }
        '201': { description: Inactive merchant account created. }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '409': { description: EMAIL_ALREADY_EXISTS. }
        '422': { $ref: '#/components/responses/BadRequest' }
  /internal/merchant-owners/{userId}/lifecycle:
    post:
      operationId: identityInternalMerchantLifecycle
      summary: Apply one merchant lifecycle transition exactly once
      description: >-
        Every new transition increments session_version exactly once, even when
        is_active already matches the target. Reusing a transitionId with a
        different payload returns TRANSITION_ID_CONFLICT. A lower sequence than
        the latest applied transition returns STALE_TRANSITION. REJECT and
        SUSPEND revoke every refresh token.
      parameters:
        - $ref: '#/components/parameters/InternalToken'
        - $ref: '#/components/parameters/RequestId'
        - name: userId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [transitionId, sequence, operation]
              properties:
                transitionId: { type: string, format: uuid }
                sequence: { type: integer, minimum: 1 }
                operation: { type: string, enum: [APPROVE, REJECT, SUSPEND] }
      responses:
        '200':
          description: Applied or already applied.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      sessionVersion: { type: integer }
                      isActive: { type: boolean }
                      alreadyApplied: { type: boolean }
                      revokedSessions: { type: integer }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: >-
            `TRANSITION_ID_CONFLICT`, `STALE_TRANSITION`, or `NOT_A_MERCHANT_OWNER`
            when the user is not a MERCHANT.
  /internal/merchant-owners/{userId}:
    delete:
      operationId: identityInternalDeleteMerchantOwner
      summary: Compensate a failed merchant registration
      description: >-
        Deletes only an inactive, unverified MERCHANT owner with no refresh
        tokens and no lifecycle transitions.
      parameters:
        - $ref: '#/components/parameters/InternalToken'
        - $ref: '#/components/parameters/RequestId'
        - name: userId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: Deleted. }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: >-
            `OWNER_NOT_ELIGIBLE`: the account is not an inactive, unverified
            MERCHANT, or it has a session or a lifecycle transition. It is left
            untouched.

components:
  parameters:
    InternalToken:
      name: X-Internal-Token
      in: header
      required: true
      description: The shared secret from `INTERNAL_TOKEN`. Never log it.
      schema: { type: string, minLength: 16 }
    RequestId:
      name: X-Request-Id
      in: header
      required: true
      description: 1 to 128 characters from letters, digits and `- . _ :`.
      schema:
        {
          type: string,
          minLength: 1,
          maxLength: 128,
          pattern: '^[A-Za-z0-9._:-]+$',
        }
  schemas:
    EligibilityEnvelope:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [isActive, isAvailable, role]
          properties:
            isActive: { type: boolean }
            isAvailable: { type: boolean }
            role:
              type: string
              enum: [CUSTOMER, MERCHANT, COURIER, DISPATCHER, ADMIN]
        meta:
          $ref: '#/components/schemas/SuccessMeta'
    ContactEnvelope:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [fullName, email, phone]
          properties:
            fullName: { type: string }
            email: { type: string }
            phone: { type: string, description: Empty when the user has none. }
        meta:
          $ref: '#/components/schemas/SuccessMeta'
    SuccessMeta:
      type: object
      required: [requestId, timestamp]
      properties:
        requestId: { type: string }
        timestamp: { type: string, format: date-time }
    ErrorResponse:
      type: object
      required: [error, meta]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
        meta:
          type: object
          required: [requestId]
          properties:
            requestId: { type: string }
  responses:
    BadRequest:
      description: '`X-Request-Id` is missing or malformed (`BAD_REQUEST`). Checked after the token.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthenticated:
      description: >-
        `X-Internal-Token` is missing or wrong, or Identity has no valid
        `INTERNAL_TOKEN` of its own (`UNAUTHENTICATED`). Treat this as a
        configuration fault, never as "not found".
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: No user has that ID, or the ID is not a UUID (`NOT_FOUND`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalServerError:
      description: Unexpected failure (`INTERNAL_ERROR`). Safe to retry.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
