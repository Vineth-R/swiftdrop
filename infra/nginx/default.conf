map $http_x_request_id $swiftdrop_request_id {
    default $http_x_request_id;
    ""      $request_id;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

upstream identity_upstream {
    server identity:8081;
}

upstream parcel_upstream {
    server parcel:8082;
}

upstream pricing_upstream {
    server pricing:8083;
}

upstream merchant_upstream {
    server merchant:8084;
}

upstream realtime_upstream {
    server realtime:8085;
}

upstream web_upstream {
    server web:3000;
}

server {
    listen 80;
    server_name _;
    server_tokens off;

    proxy_http_version 1.1;
    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $swiftdrop_request_id;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /api/v1/identity {
        return 308 /api/v1/identity/;
    }

    location /api/v1/identity/ {
        rewrite ^/api/v1/identity/(.*)$ /$1 break;
        proxy_pass http://identity_upstream;
    }

    location = /api/v1/parcels {
        return 308 /api/v1/parcels/;
    }

    location /api/v1/parcels/ {
        rewrite ^/api/v1/parcels/(.*)$ /$1 break;
        proxy_pass http://parcel_upstream;
    }

    location = /api/v1/pricing {
        return 308 /api/v1/pricing/;
    }

    location /api/v1/pricing/ {
        rewrite ^/api/v1/pricing/(.*)$ /$1 break;
        proxy_pass http://pricing_upstream;
    }

    location = /api/v1/merchants {
        return 308 /api/v1/merchants/;
    }

    location /api/v1/merchants/ {
        rewrite ^/api/v1/merchants/(.*)$ /$1 break;
        proxy_pass http://merchant_upstream;
    }

    location = /api/v1/realtime {
        return 308 /api/v1/realtime/;
    }

    location /api/v1/realtime/ {
        rewrite ^/api/v1/realtime/(.*)$ /$1 break;
        proxy_pass http://realtime_upstream;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        proxy_pass http://web_upstream;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
