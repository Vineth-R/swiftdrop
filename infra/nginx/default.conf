map $http_x_request_id $swiftdrop_request_id {
    default $http_x_request_id;
    ""      $request_id;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

# Authentication callbacks can carry an authorization code and state in the
# query string. Log the URI path only, never $request/$request_uri/$args, so
# OAuth credentials do not reach the gateway access log.
log_format swiftdrop_no_query '$remote_addr - $remote_user [$time_local] '
                              '"$request_method $uri $server_protocol" '
                              '$status $body_bytes_sent "$http_referer" '
                              '"$http_user_agent" "$http_x_forwarded_for"';

upstream identity_upstream {
    server identity:8081;
}

upstream parcel_upstream {
    server parcel:8082;
}

upstream pricing_upstream {
    server pricing:8083;
}

upstream merchant_upstream {
    server merchant:8084;
}

upstream realtime_upstream {
    server realtime:8085;
}

upstream notification_worker_upstream {
    server notification-worker:8086;
}

upstream web_upstream {
    server web:3000;
}

server {
    listen 80;
    server_name _;
    server_tokens off;

    proxy_http_version 1.1;
    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # Replace caller-supplied forwarding chains at the single public edge.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $swiftdrop_request_id;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /healthz {
        default_type application/json;
        return 200 '{"status":"ok"}';
    }

    # Internal service-to-service APIs are never exposed through the gateway.
    location ^~ /internal {
        default_type application/json;
        return 404 '{"error":{"code":"NOT_FOUND","message":"route not found"},"meta":{"requestId":"$swiftdrop_request_id"}}';
    }

    # Reject a prefixed internal URL too, rather than falling through to the web
    # dev proxy, which forwards /api/v1 back to this gateway.
    location ^~ /api/v1/internal {
        default_type application/json;
        return 404 '{"error":{"code":"NOT_FOUND","message":"route not found"},"meta":{"requestId":"$swiftdrop_request_id"}}';
    }

    # TODO: the AI service is not part of this milestone.
    location ^~ /api/v1/ai {
        default_type application/json;
        return 404 '{"error":{"code":"NOT_FOUND","message":"AI service is not implemented"},"meta":{"requestId":"$swiftdrop_request_id"}}';
    }

    # Identity: /api/v1/auth, /users, /admin/users, /couriers
    location = /api/v1/auth { return 308 /api/v1/auth/; }
    location /api/v1/auth/ {
        # Never log the OAuth code/state query string.
        access_log /var/log/nginx/access.log swiftdrop_no_query;
        rewrite ^/api/v1/(.*)$ /$1 break;
        proxy_pass http://identity_upstream;
    }
    location = /api/v1/users { return 308 /api/v1/users/; }
    location /api/v1/users/ {
        rewrite ^/api/v1/(.*)$ /$1 break;
        proxy_pass http://identity_upstream;
    }
    location /api/v1/admin/users/ {
        rewrite ^/api/v1/(.*)$ /$1 break;
        proxy_pass http://identity_upstream;
    }
    location = /api/v1/couriers { return 308 /api/v1/couriers/; }
    location /api/v1/couriers/ {
        rewrite ^/api/v1/(.*)$ /$1 break;
        proxy_pass http://identity_upstream;
    }

    # Notification worker: ADMIN-only notification delivery log reads.
    location = /api/v1/admin/notification-logs {
        rewrite ^/api/v1/(.*)$ /$1 break;
        proxy_pass http://notification_worker_upstream;
    }
    location /api/v1/admin/notification-logs/ {
        rewrite ^/api/v1/(.*)$ /$1 break;
        proxy_pass http://notification_worker_upstream;
    }

    # Pricing: /api/v1/pricing, /zones, /admin/pricing, /admin/zones
    location = /api/v1/pricing { return 308 /api/v1/pricing/; }
    location /api/v1/pricing/ {
        rewrite ^/api/v1/(.*)$ /$1 break;
        proxy_pass http://pricing_upstream;
    }
    location = /api/v1/zones {
        rewrite ^/api/v1/(.*)$ /$1 break;
        proxy_pass http://pricing_upstream;
    }
    location /api/v1/zones/ {
        rewrite ^/api/v1/(.*)$ /$1 break;
        proxy_pass http://pricing_upstream;
    }
    location /api/v1/admin/pricing/ {
        rewrite ^/api/v1/(.*)$ /$1 break;
        proxy_pass http://pricing_upstream;
    }
    location = /api/v1/admin/zones {
        rewrite ^/api/v1/(.*)$ /$1 break;
        proxy_pass http://pricing_upstream;
    }
    location /api/v1/admin/zones/ {
        rewrite ^/api/v1/(.*)$ /$1 break;
        proxy_pass http://pricing_upstream;
    }

    # Parcel: /api/v1/parcels, /tracking, /dispatch, /admin/parcels, /courier, /reports
    # Preserve the canonical collection path and POST body; Gin registers /parcels.
    location = /api/v1/parcels {
        rewrite ^/api/v1/(.*)$ /$1 break;
        proxy_pass http://parcel_upstream;
    }
    location /api/v1/parcels/ {
        rewrite ^/api/v1/(.*)$ /$1 break;
        proxy_pass http://parcel_upstream;
    }
    location = /api/v1/tracking { return 308 /api/v1/tracking/; }
    location /api/v1/tracking/ {
        rewrite ^/api/v1/(.*)$ /$1 break;
        proxy_pass http://parcel_upstream;
    }
    location /api/v1/dispatch/ {
        rewrite ^/api/v1/(.*)$ /$1 break;
        proxy_pass http://parcel_upstream;
    }
    location = /api/v1/admin/parcels {
        rewrite ^/api/v1/(.*)$ /$1 break;
        proxy_pass http://parcel_upstream;
    }
    location /api/v1/admin/parcels/ {
        rewrite ^/api/v1/(.*)$ /$1 break;
        proxy_pass http://parcel_upstream;
    }
    location = /api/v1/courier { return 308 /api/v1/courier/; }
    location /api/v1/courier/ {
        # API v1.1 6.1/6.2/6.3: courier delivery list, assignment-scoped detail and status updates.
        rewrite ^/api/v1/(.*)$ /$1 break;
        proxy_pass http://parcel_upstream;
    }
    location /api/v1/reports/ {
        rewrite ^/api/v1/(.*)$ /$1 break;
        proxy_pass http://parcel_upstream;
    }

    # Merchant: /api/v1/merchants, /merchant, /admin/merchants
    location = /api/v1/merchants { return 308 /api/v1/merchants/; }
    location /api/v1/merchants/ {
        rewrite ^/api/v1/(.*)$ /$1 break;
        proxy_pass http://merchant_upstream;
    }
    location = /api/v1/merchant { return 308 /api/v1/merchant/; }
    location /api/v1/merchant/ {
        rewrite ^/api/v1/(.*)$ /$1 break;
        proxy_pass http://merchant_upstream;
    }
    location /api/v1/admin/merchants/ {
        rewrite ^/api/v1/(.*)$ /$1 break;
        proxy_pass http://merchant_upstream;
    }

    # Realtime WebSocket endpoint (API v1.1 section 9).
    location = /ws {
        proxy_pass http://realtime_upstream;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        proxy_pass http://web_upstream;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
