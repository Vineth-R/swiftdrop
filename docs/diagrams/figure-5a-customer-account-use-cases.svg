<text x="870" y="324.5" text-anchor="middle" font-size="14.5" fill="#1B2430">logins (423)</text>
<ellipse cx="870" cy="373" rx="125.0" ry="27.0" fill="#FFFFFF" stroke="#6B7A99" stroke-width="2"/>
