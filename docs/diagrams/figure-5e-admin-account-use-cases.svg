<text x="520" y="418.5" text-anchor="middle" font-size="14.5" fill="#1B2430">Manage users</text>
<ellipse cx="870" cy="275" rx="125.0" ry="27.0" fill="#FFFFFF" stroke="#6B7A99" stroke-width="2"/>
<text x="870" y="271.5" text-anchor="middle" font-size="14.5" fill="#1B2430">List, search and view</text>
