<ellipse cx="870" cy="340" rx="125.0" ry="27.0" fill="#FFFFFF" stroke="#6B7A99" stroke-width="2"/>
<text x="870" y="336.5" text-anchor="middle" font-size="14.5" fill="#1B2430">Create a staff account</text>
<text x="870" y="353.5" text-anchor="middle" font-size="14.5" fill="#1B2430">(courier, dispatcher, admin)</text>
<ellipse cx="870" cy="405" rx="125.0" ry="27.0" fill="#FFFFFF" stroke="#6B7A99" stroke-width="2"/>
<text x="870" y="401.5" text-anchor="middle" font-size="14.5" fill="#1B2430">Edit a profile, role or</text>
