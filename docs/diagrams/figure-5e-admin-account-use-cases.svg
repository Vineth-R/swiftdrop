<ellipse cx="870" cy="470" rx="125.0" ry="27.0" fill="#FFFFFF" stroke="#6B7A99" stroke-width="2"/>
<text x="870" y="466.5" text-anchor="middle" font-size="14.5" fill="#1B2430">Activate or deactivate;</text>
<text x="870" y="483.5" text-anchor="middle" font-size="14.5" fill="#1B2430">deactivation revokes tokens</text>
<ellipse cx="870" cy="535" rx="125.0" ry="27.0" fill="#FFFFFF" stroke="#6B7A99" stroke-width="2"/>
