<text x="52" y="724" font-size="13" font-weight="700" fill="#6B5A0E">Preconditions</text>
<text x="52" y="742" font-size="13" fill="#1B2430">UC-U1, UC-U2 and UC-U4 need a signed-in</text>
<text x="52" y="760" font-size="13" fill="#1B2430">session: access token valid for 15 minutes.</text>
<text x="52" y="778" font-size="13" fill="#1B2430">UC-U3 is for a user who cannot sign in.</text>
<text x="52" y="796" font-size="13" fill="#1B2430">Google-only accounts have no password,</text>
<text x="52" y="814" font-size="13" fill="#1B2430">so they cannot use UC-U2 or UC-U3.</text>
